# Build the documentation website with Hugo and the Blowfish theme, and
# publish it to GitHub Pages. The build runs the same recipe as a
# workstation (`just site` in the `site` dev shell); only publishing is
# specific to this host. Follows Hugo's guide for GitHub Pages:
# https://gohugo.io/host-and-deploy/deploy-to-github-pages/
#
# A free organisation can publish Pages only from a public repository, so
# both jobs are skipped while this repository is private.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let a running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          determinate: false

      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: false

      - id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        run: nix develop .#site --command just site "${{ steps.pages.outputs.base_url }}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site/public

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
