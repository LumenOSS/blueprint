# yaml-language-server: $schema=../schema/standards.schema.json
#
# The standards register: every external standard the blueprint relies on,
# with the edition relied on, the publisher's own page, and when and how it
# was checked. docs/standards.md and each capability page's "Standards"
# section are generated from this file (`just render`). Re-check every
# entry at least once a year; a new edition is a reviewed change.

areas:
  - id: language
    name: Requirement language
  - id: representation
    name: Data representation
  - id: education
    name: Education classifications and indicators
  - id: metadata-quality
    name: Metadata and data quality
  - id: statistics
    name: Official statistics and disclosure control
  - id: exchange
    name: Open data and exchange
  - id: identity-security
    name: Identity, security and privacy
  - id: supply-chain
    name: Software supply chain
  - id: accessibility
    name: Accessibility and localisation
  - id: open-source-health
    name: Open-source health and digital public goods

standards:
  # ------------------------------------------------------------ language
  - id: STD-BCP14
    title: BCP 14 (RFC 2119 and RFC 8174)
    edition: RFC 2119 (1997) with RFC 8174 (2017)
    publisher: IETF
    url: https://www.rfc-editor.org/info/bcp14
    checked: 2026-10-15
    check: publisher
    verdict: adopt
    area: language
    purpose: The meaning of MUST, SHOULD and MAY; only the upper-case forms are normative.
    used_by: []

  # ------------------------------------------------------------ representation
