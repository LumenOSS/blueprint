    publisher: IETF
    url: https://www.rfc-editor.org/info/rfc3339
    checked: 2026-10-15
    check: publisher
    verdict: adopt
    area: representation
    purpose: The strict, testable profile of ISO 8601 used for every stored or exchanged timestamp, with an explicit offset.
    used_by: [CAP-REFERENCE]
  - id: STD-RFC9557
