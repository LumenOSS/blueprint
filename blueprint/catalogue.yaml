# yaml-language-server: $schema=../schema/catalogue.schema.json
#
# The catalogue: every capability of the architecture and the contract each
# must meet. This file is the single source of capability IDs and clause
# text; the capability pages render their contract tables from it
# (`just render`). IDs are never renumbered or reused.

version: 0.2.0

layers:
  - id: L0
    name: Bootstrap
    summary: >-
      The trust anchors: the state store and the CI identities. Changed rarely, by dispatch, with two roles approving.
  - id: L1
    name: Platform
    summary: >-
      Shared infrastructure and governance that every product uses, and the registry through which products are onboarded.
  - id: L2
    name: Modules
    summary: >-
      Versioned building blocks consumed by tag. They hold no state and no identity of their own.
  - id: L3
    name: Products
    summary: >-
      Workloads built on the platform, each in its own repository, deploying only inside the boundary its tenant entry grants.

domains:
  - id: delivery
    name: Trust and delivery
    summary: >-
      Who may change what, with which identity, and how a change reaches an environment.
  - id: data
    name: Data platform core
    summary: >-
      Where data lives, how it is computed on, and how it reaches the people who use it.
  - id: governance
    name: Governance and access
    summary: >-
      Who may see which rows and columns, how that is recorded, and how data leaves the platform.
  - id: movement
    name: Environments and data movement
    summary: >-
      How environments are isolated, and how data is backfilled, migrated and retired without loss.
  - id: product
    name: Product patterns
    summary: >-
      The contracts a product meets so that its pipeline is retryable, its decisions reviewable and its results releasable.

capabilities:
  # ---------------------------------------------------------------- delivery
  - id: CAP-REPOSITORIES
    name: Repositories by trust
    domain: delivery
    layer: L0
    summary: >-
      Each layer is its own repository and the unit of trust for its CI identities.
    clauses:
      - id: CAP-REPOSITORIES.1
        level: MUST
        text: >-
          Bootstrap, platform, modules and each product are separate repositories.
        verify: >-
          List the repositories; each layer and each product has exactly one.
      - id: CAP-REPOSITORIES.2
        level: MUST
        text: >-
          Each federated credential trusts exactly one repository, so a change in one repository cannot obtain another's identity.
        verify: >-
          Export every federated credential subject; each names one repository and one protected environment.
      - id: CAP-REPOSITORIES.3
        level: MUST
        text: >-
          Every task runs as a recipe in a pinned toolchain, invoked the same way on a workstation and in CI; CI definitions only call recipes.
        verify: >-
          Inspect the CI definitions: every step is a toolchain bootstrap or a recipe invocation.
      - id: CAP-REPOSITORIES.4
        level: MUST
        text: >-
          Published history is never rewritten; a correction is a new change on top.
        verify: >-
          The protected branch refuses force-pushes.
      - id: CAP-REPOSITORIES.5
        level: SHOULD
        text: >-
          A repository can be hosted on more than one CI host without code changes beyond a thin CI wrapper.
        verify: >-
          The repository carries the CI definition of each host it targets, and each calls the same recipes.

  - id: CAP-STATE
    name: Infrastructure state
    domain: delivery
    layer: L0
    summary: >-
      Remote, locked, versioned and encrypted state for every stack, readable only by the identities that own it.
    depends_on: [CAP-MODULES]
    clauses:
      - id: CAP-STATE.1
        level: MUST
        text: >-
          State is remote, one state per stack per environment, with a lock that blocks a concurrent apply.
        verify: >-
          Start two plans against one stack; the second waits or fails on the lock.
      - id: CAP-STATE.2
        level: MUST
        text: >-
          Every state version is recoverable after an overwrite or deletion.
        verify: >-
          Restore drill: overwrite a test stack's state, recover the prior version, and plan shows no changes.
      - id: CAP-STATE.3
        level: MUST
        text: >-
          State is encrypted at rest with a key under the platform's control and is reached by identity, never by a shared access key.
        verify: >-
          Shared-key access to the store is disabled; the encryption key is in the platform's key store.
      - id: CAP-STATE.4
        level: MUST
        text: >-
          A product's identity cannot read platform or bootstrap state.
        verify: >-
          Negative test: a read of platform state with a product identity is denied.
      - id: CAP-STATE.5
        level: MUST
        text: >-
          The state store can be created from an empty account by the bootstrap layer, and its reachability is proven by write, read, compare and delete before first use.
        verify: >-
          The bootstrap recipe runs against an empty account and its probe reports success.
      - id: CAP-STATE.6
        level: MUST
        text: >-
          Stacks find each other's resources by deterministic name, not by reading each other's state.
        verify: >-
          No stack declares a remote-state data source.
      - id: CAP-STATE.7
        level: MUST
        text: >-
          A stack that moves between repositories keeps its state key, and its first plan in the new place shows no changes.
        verify: >-
          The move's review includes a no-change plan.
      - id: CAP-STATE.8
        level: SHOULD
        text: >-
          State lives apart from lake storage, because the protections each needs (object versioning, lifecycle rules) conflict.
        verify: >-
          The state store is a separate account or bucket from every lake store.

  - id: CAP-CIIDENTITY
    name: CI workload identity
    domain: delivery
    layer: L0
    summary: >-
      CI authenticates by federation with short-lived tokens; the root of trust is created once by a person.
    clauses:
      - id: CAP-CIIDENTITY.1
        level: MUST
        text: >-
          No long-lived credential for a cloud, data platform or registry exists in any repository or CI variable; CI exchanges its host-issued token for a short-lived one.
        verify: >-
          Inventory the CI secrets and variables; none is a credential for a platform service.
      - id: CAP-CIIDENTITY.2
        level: MUST
        text: >-
          A federated credential binds a protected environment, not a branch or tag, so the binding cannot be edited by a change under review.
        verify: >-
          Every credential subject names an environment; every environment restricts which branch may deploy.
      - id: CAP-CIIDENTITY.3
        level: MUST
        text: >-
          Plan and apply run as different identities, and the plan identity cannot change anything.
        verify: >-
          Negative test: an apply attempted with the plan identity is denied.
      - id: CAP-CIIDENTITY.4
        level: MUST
        text: >-
          The identity that creates CI identities is created once by a person, recorded in the bootstrap repository with its rights and its creator's role, and never applies the code declaring its own credentials.
        verify: >-
          The bootstrap README records the identity; its apply refuses the stack that declares it.
      - id: CAP-CIIDENTITY.5
        level: MUST
        text: >-
          A right to assign roles is conditioned to an enumerated list of roles on named scopes, never organisation-wide.
        verify: >-
          Read the role assignment's condition; it lists the assignable roles.
      - id: CAP-CIIDENTITY.6
        level: SHOULD
        text: >-
          Each product has one deploy identity and one run-as identity per environment.
        verify: >-
          The tenant registry generates exactly those two per product per environment.

  - id: CAP-DELIVERY
    name: Change delivery
    domain: delivery
    layer: L1
    summary: >-
      Every change is reviewed with its plan and applied by CI only, after merge.
    depends_on: [CAP-CIIDENTITY, CAP-STATE]
    clauses:
      - id: CAP-DELIVERY.1
        level: MUST
        text: >-
          Every change to infrastructure or a shared environment, including grants, migrations and deletions, is a reviewed change whose plan is shown in the review.
        verify: >-
          Sample merged changes; each carries the plan CI produced for it.
      - id: CAP-DELIVERY.2
        level: MUST
        text: >-
          Only CI applies. Apply recipes refuse to run anywhere else.
        verify: >-
          Run an apply recipe on a workstation; it refuses before contacting any API.
      - id: CAP-DELIVERY.3
        level: MUST
        text: >-
          CI applies the saved plan that was reviewed, not a fresh one.
        verify: >-
          The apply step consumes the plan artefact produced by the plan step.
      - id: CAP-DELIVERY.4
        level: MUST
        text: >-
          A trust-anchor change is dispatched by hand from the main branch by an allow-listed role, after approval by both the Data Lead and the Technical Lead.
        verify: >-
          The bootstrap pipeline checks the actor against its allow-list before any credential is issued; its environment requires two approvals.
      - id: CAP-DELIVERY.5
        level: MUST
        text: >-
          A deletion is two changes: adopt the object into code, then remove it.
        verify: >-
          Every removal of a resource in history is preceded by a change that imported it or created it.
      - id: CAP-DELIVERY.6
        level: MUST
        text: >-
          A database is migrated before the code that needs it is deployed; a release is a version tag, and an infrastructure change alone never changes what version runs.
        verify: >-
          Pipeline order runs migrations first; deployments take the image version from a tag.
      - id: CAP-DELIVERY.7
        level: SHOULD
        text: >-
          A scheduled fitness check fails if any state was written by an identity other than CI.
        verify: >-
          The check reads the last writer of each state version and alerts on a non-CI principal.
      - id: CAP-DELIVERY.8
        level: SHOULD
        text: >-
          Every deployable artefact carries SLSA v1.2 Build Level 3 provenance and a software bill of materials in SPDX 2.3 or later or CycloneDX 1.5 or later.
        verify: >-
          Release artefacts include a provenance attestation and an SBOM that validate.

  - id: CAP-MODULES
    name: Versioned modules
    domain: delivery
    layer: L2
    summary: >-
      Shared building blocks consumed by immutable version, including deterministic naming.
    clauses:
      - id: CAP-MODULES.1
        level: MUST
        text: >-
          Modules are consumed by an immutable version reference, never a branch.
        verify: >-
          Every module source pins a tag or digest.
      - id: CAP-MODULES.2
        level: MUST
        text: >-
          A naming module derives every resource name and tag set deterministically from type, project, environment, region and instance.
        verify: >-
          The module's tests assert the same inputs give the same names.
      - id: CAP-MODULES.3
        level: SHOULD
        text: >-
          Module versions follow semantic versioning; a change to any output that alters a resource name is a major version.
        verify: >-
          The module's changelog marks name changes as breaking.

  - id: CAP-ONBOARDING
    name: Tenant onboarding registry
    domain: delivery
    layer: L1
    summary: >-
      One reviewed declaration per product or source generates its identities, grants, schemas and reviewers.
    depends_on: [CAP-DELIVERY, CAP-CATALOG, CAP-CIIDENTITY]
    clauses:
      - id: CAP-ONBOARDING.1
        level: MUST
        text: >-
          Each product or source has one tenant entry declaring its owner role, domain, ingestion method, highest classification, the catalogs it writes and reads, its operational database, and the repository the platform trusts for it.
        verify: >-
          Every product's resources trace back to exactly one tenant entry.
      - id: CAP-ONBOARDING.2
        level: MUST
        text: >-
          Identities, grants, schemas and required reviewers are generated from the entry and never created by hand.
        verify: >-
          A reconciliation diff between generated and live grants is empty.
      - id: CAP-ONBOARDING.3
        level: MUST
        text: >-
          The platform publishes each product's outputs per environment (endpoints, catalog names, identities, compute IDs) to the product, and a product never reads platform state.
        verify: >-
          The product's configuration takes these values from published outputs; it has no access to platform state.
      - id: CAP-ONBOARDING.4
        level: MUST
        text: >-
          Removing a tenant entry removes the access it generated.
        verify: >-
          Off-boarding test: remove an entry; its identities and grants are gone after apply.

  - id: CAP-SECRETS
    name: Secrets and keys
    domain: delivery
    layer: L1
    summary: >-
      Secrets and keys live in a managed store and are fetched by identity at runtime.
    clauses:
      - id: CAP-SECRETS.1
        level: MUST
        text: >-
          Secrets are held in a managed secret store; none is committed in plaintext, and any encrypted file in a repository has a recipient set of roles or CI, never one person.
        verify: >-
          A secret scanner runs on every change; encrypted files list non-personal recipients.
      - id: CAP-SECRETS.2
        level: MUST
        text: >-
          Settings that can only be chosen at creation, such as customer-managed keys, are decided and recorded before an environment's first apply.
        verify: >-
          The environment's values file sets each creation-only option explicitly.
      - id: CAP-SECRETS.3
        level: SHOULD
        text: >-
          Workloads read secrets at runtime using their own identity, so no secret is copied into deployment configuration.
        verify: >-
          Deployment manifests reference secrets by name, not value.

  - id: CAP-NETWORK
    name: Network isolation
    domain: delivery
    layer: L1
    summary: >-
      Data services are private; only applications are exposed, behind sign-in.
    clauses:
      - id: CAP-NETWORK.1
        level: MUST
        text: >-
          Storage, catalog data paths, databases and secret stores are reachable only on private network paths.
        verify: >-
          A policy check on every plan fails a public endpoint on a data service; an external probe of each endpoint fails.
      - id: CAP-NETWORK.2
        level: MUST
        text: >-
          Only applications are exposed, and only through a gateway that requires identity-provider sign-in.
        verify: >-
          An unauthenticated request to each public host is redirected to sign-in or refused.
      - id: CAP-NETWORK.3
        level: MUST
        text: >-
          Traffic is denied by default between workloads; each allowed path is declared.
        verify: >-
          A workload with no declared path cannot reach a data service.
      - id: CAP-NETWORK.4
        level: SHOULD
        text: >-
          Outbound traffic leaves through one controlled egress point.
        verify: >-
          Route tables send internet-bound traffic through the egress point only.

  - id: CAP-GUARDRAILS
    name: Guardrails and fitness functions
    domain: delivery
    layer: L1
    summary: >-
      Policy as code on every plan, and scheduled checks that the architecture's properties still hold.
    depends_on: [CAP-DELIVERY]
    clauses:
      - id: CAP-GUARDRAILS.1
        level: MUST
        text: >-
          Policies evaluated on every plan reject public endpoints on data services, missing required tags and names that do not follow the naming module.
        verify: >-
          A deliberately non-conforming plan in a test change is rejected.
      - id: CAP-GUARDRAILS.2
        level: MUST
        text: >-
          Scheduled fitness functions check that every table carries provenance and classification tags, that a restore reproduces content hashes, and that cost per task stays within budget, each on a declared schedule.
        verify: >-
          Each check exists, has run on schedule, and alerts when it fails.
      - id: CAP-GUARDRAILS.3
        level: SHOULD
        text: >-
          The platform's own repositories and every third-party open-source component are assessed with OpenSSF Scorecard on a schedule, and low scores are reviewed.
        verify: >-
          Scorecard results are recorded per repository and component, with reviews of low scores.

  # ---------------------------------------------------------------- data
  - id: CAP-STORAGE
    name: Object storage
    domain: data
    layer: L1
    summary: >-
      Durable object storage for tables and files, isolated per domain catalog.
    clauses:
      - id: CAP-STORAGE.1
        level: MUST
        text: >-
          Storage exposes an object API reached by identity, with encryption at rest.
        verify: >-
          Anonymous and shared-key access are refused.
      - id: CAP-STORAGE.2
        level: MUST
        text: >-
          Each domain catalog has its own storage location and credential, so a grant on one domain never reaches another's files.
        verify: >-
          A credential for one domain cannot list another domain's location.
      - id: CAP-STORAGE.3
        level: MUST
        text: >-
          Protection against accidental deletion is configured in a way the table format supports; it never breaks table maintenance.
        verify: >-
          Maintenance (expiry, vacuum) runs clean, and a deleted table is restored in a drill.
      - id: CAP-STORAGE.4
        level: MUST
        text: >-
          Source-of-record files are kept in governed storage, tagged as real, with retention set by the data owner.
        verify: >-
          The archive location carries provenance and retention metadata.
      - id: CAP-STORAGE.5
        level: MUST
        text: >-
          Object storage and the catalog are backed up on a declared cadence to a geographically separate location, and a scheduled drill restores from backup outside any migration.
        verify: >-
          The backup schedule is in code; the latest restore drill report compares content hashes and is within its schedule.

  - id: CAP-TABLES
    name: Open table format
    domain: data
    layer: L1
    summary: >-
      Transactional tables in an open format, readable by more than one engine.
    depends_on: [CAP-STORAGE]
    clauses:
      - id: CAP-TABLES.1
        level: MUST
        text: >-
          Tables use an open, specified format with atomic commits, schema evolution and time travel.
        verify: >-
          The format's specification is public; a commit is atomic under concurrent writers.
      - id: CAP-TABLES.2
        level: MUST
        text: >-
          Every table is readable by at least two independent engines.
        verify: >-
          Exit test: read a sample of gold tables with an engine other than the one that wrote them; counts and hashes match.
      - id: CAP-TABLES.3
        level: MUST
        text: >-
          History retention is configurable per table and can be held during a fallback window.
        verify: >-
          Retention settings are declared in code; a hold suspends expiry.
      - id: CAP-TABLES.4
        level: SHOULD
        text: >-
          Writers batch into set-based operations, because each statement is a commit.
        verify: >-
          Pipeline code issues one write per batch, not per row.

  - id: CAP-CATALOG
    name: Catalog and governance plane
    domain: data
    layer: L1
    summary: >-
      One catalog of record for tables, files and functions, enforcing grants, tags and policies.
    depends_on: [CAP-TABLES, CAP-IDENTITY]
    clauses:
      - id: CAP-CATALOG.1
        level: MUST
        text: >-
          One catalog of record lists every table, volume of files and function, whichever engine created it.
        verify: >-
          An inventory of storage locations has no table unknown to the catalog.
      - id: CAP-CATALOG.2
        level: MUST
        text: >-
          Catalogs are named domain by environment (`<domain>_<env>`); a product is a set of schemas inside its domain, and data shared across domains is promoted to its owning domain and read from there, never copied.
        verify: >-
          Catalog and schema names match the pattern; no table is a copy of another domain's.
      - id: CAP-CATALOG.3
        level: MUST
        text: >-
          Grants go only to groups, and production objects are owned by groups.
        verify: >-
          A query of grants and owners finds no individual user.
      - id: CAP-CATALOG.4
        level: MUST
        text: >-
          Governed tags (provenance, classification) can be set only by principals granted the right to assign them.
        verify: >-
          Negative test: an analyst cannot set a classification tag.
      - id: CAP-CATALOG.5
        level: MUST
        text: >-
          Row filters and column masks are enforced on every read path that serves protected data; an engine that cannot enforce them is denied those tables.
        verify: >-
          Read a protected table through each engine as a scoped user; each returns only the scoped rows or is refused.
      - id: CAP-CATALOG.6
        level: MUST
        text: >-
          Engines receive short-lived, scoped storage credentials from the catalog, never long-lived storage keys.
        verify: >-
          Engine configuration holds no storage key; credentials observed in use expire.
      - id: CAP-CATALOG.7
        level: SHOULD
        text: >-
          Every authenticated user may browse metadata, so data can be found without being readable.
        verify: >-
          A user with no data grants can list catalog objects but not read them.

  - id: CAP-COMPUTE
    name: Compute
    domain: data
    layer: L1
    summary: >-
      Batch, streaming and interactive SQL compute that scales to zero and reads only through the catalog.
    depends_on: [CAP-CATALOG]
    clauses:
      - id: CAP-COMPUTE.1
        level: MUST
        text: >-
          Compute scales to zero when idle.
        verify: >-
          Billing or node metrics show no compute between scheduled work.
      - id: CAP-COMPUTE.2
        level: MUST
        text: >-
          Jobs run as non-human identities.
        verify: >-
          Every job's run-as principal is a workload identity.
      - id: CAP-COMPUTE.3
        level: MUST
        text: >-
          Engines read and write data only through the catalog.
        verify: >-
          Direct storage paths are refused to engine identities.
      - id: CAP-COMPUTE.4
        level: MUST
        text: >-
          Interactive queries behind an application meet a declared latency objective (the reference value is 5 seconds at p95), and the timeout is that objective, not a longer probe.
        verify: >-
          Measured p95 for the application's queries over a week.

  - id: CAP-OPERATIONALDB
    name: Operational database with branching
    domain: data
    layer: L1
    summary: >-
      Each product's transactional Postgres store, with copy-on-write branches of production.
    depends_on: [CAP-IDENTITY]
    clauses:
      - id: CAP-OPERATIONALDB.1
        level: MUST
        text: >-
          The operational database speaks the Postgres protocol and SQL dialect.
        verify: >-
          The product's migrations and tests run unchanged against it.
      - id: CAP-OPERATIONALDB.2
        level: MUST
        text: >-
          A branch of production, or of a point in time, is created without copying data first, and carries a time to live.
        verify: >-
          Create a branch of the production database and time it; it expires on schedule.
      - id: CAP-OPERATIONALDB.3
        level: MUST
        text: >-
          The production branch is protected from deletion and from writes by development identities.
        verify: >-
          Negative tests: delete and write as a development identity both fail.
      - id: CAP-OPERATIONALDB.4
        level: MUST
        text: >-
          Connections authenticate per identity; an application's access is governed by database roles and row-level security, and each catalog policy names its database counterpart or states there is none.
        verify: >-
          No shared password role is in use; the policy register pairs each catalog policy with its database policy.
      - id: CAP-OPERATIONALDB.5
        level: MUST
        text: >-
          Migrations are idempotent twice over: a ledger records what ran, and every statement can be run again safely. Schemas change by expand then contract, one phase per migration, and the application refuses to write to a database behind its code.
        verify: >-
          CI applies every migration twice to a branch; the application's schema gate is tested against an older database.
      - id: CAP-OPERATIONALDB.6
        level: MUST
        text: >-
          Committed records survive loss of a node (recovery point zero), and the database can be restored to a point in time.
        verify: >-
          Restore drill to a point in time, comparing per-table content hashes.
      - id: CAP-OPERATIONALDB.7
        level: SHOULD
        text: >-
          Analytics read operational data through the catalog or a governed extract, never through a direct connection.
        verify: >-
          No analytics identity holds a database login.

  - id: CAP-INGESTION
    name: Ingestion
    domain: data
    layer: L1
    summary: >-
      Files, in-place federation and change data capture behind one onboarding step.
    depends_on: [CAP-ONBOARDING, CAP-CATALOG]
    clauses:
      - id: CAP-INGESTION.1
        level: MUST
        text: >-
          Three ingestion methods are offered behind one onboarding step: files to a landing area, federation in place, and change data capture. The method is a value in the tenant entry.
        verify: >-
          Each method has a tenant entry in use or a test entry that plans cleanly.
      - id: CAP-INGESTION.2
        level: MUST
        text: >-
          A landing area is a queue, not a store: accepted inputs move to a content-addressed archive after verification, and refused inputs move to quarantine with a reason. Nothing is deleted without a verified archive copy.
        verify: >-
          After a run, landing holds only unprocessed files; every quarantined file has a reason sidecar.
      - id: CAP-INGESTION.3
        level: MUST
        text: >-
          Ingestion tolerates at-least-once delivery: a re-delivered input converges on the existing record by content hash or natural key.
        verify: >-
          Deliver the same input twice; row counts do not change.
      - id: CAP-INGESTION.4
        level: SHOULD
        text: >-
          A source is federated in place before it is copied; change data capture is used where a copy is worth its cost; a custom extract is the last resort.
        verify: >-
          The tenant entry records why the chosen method was chosen.

  - id: CAP-INTEROPERABILITY
    name: Exchange with other systems
    domain: data
    layer: L1
    summary: >-
      Every feed to or from another system is declared, validated at the edge and reconciled.
    depends_on: [CAP-ONBOARDING, CAP-CATALOG]
    clauses:
      - id: CAP-INTEROPERABILITY.1
        level: MUST
        text: >-
          Every exchange with another system is a feed contract in the onboarding registry, naming its counterpart, purpose, schema, schedule, owning steward and the agreement that governs it.
        verify: >-
          Every live feed traces to a registry entry.
      - id: CAP-INTEROPERABILITY.2
        level: MUST
        text: >-
          Inbound feeds from other systems are validated at the edge against a published schema before landing, and a reject report goes back to the sender.
        verify: >-
          A malformed fixture is rejected with a report and never lands.
      - id: CAP-INTEROPERABILITY.3
        level: MUST
        text: >-
          Outbound feeds are reconciled with their recipient by counts and hashes for each period.
        verify: >-
          Each outbound feed has a reconciliation record per period.
      - id: CAP-INTEROPERABILITY.4
        level: MUST
        text: >-
          Systems of record expose versioned interfaces that change additively, each described in OpenAPI 3.1 or later, with payload schemas in JSON Schema 2020-12.
        verify: >-
          A pinned contract is compared in CI; removals fail.
      - id: CAP-INTEROPERABILITY.5
        level: SHOULD
        text: >-
          Exchanged records use a recognised open education data standard where one exists: 1EdTech OneRoster 1.2 for class lists and results, 1EdTech CASE 1.1 for curriculum frameworks, and CEDS as the reference vocabulary for data elements.
        verify: >-
          Each feed names the standard it maps to, or why none applies.
      - id: CAP-INTEROPERABILITY.6
        level: SHOULD
        text: >-
          Feed health (arrival, lag, reject rate, latency) is measured per feed and reaches gold.
        verify: >-
          A gold model reports feed health per feed and period.
      - id: CAP-INTEROPERABILITY.7
        level: SHOULD
        text: >-
          Evented interfaces are described in AsyncAPI 3 and carry a CloudEvents envelope whose id and source form the idempotency key.
        verify: >-
          Each evented feed has an AsyncAPI document; a replayed event with the same id and source changes nothing.

  - id: CAP-ORCHESTRATION
    name: Orchestration
    domain: data
    layer: L3
    summary: >-
      Declared jobs with bounded runs, safe retries and range re-runs.
    depends_on: [CAP-COMPUTE, CAP-DELIVERY]
    clauses:
      - id: CAP-ORCHESTRATION.1
        level: MUST
        text: >-
          Jobs are declared in the product's repository and deployed by CI.
        verify: >-
          No job exists in an environment without a declaration in a repository.
      - id: CAP-ORCHESTRATION.2
        level: MUST
        text: >-
          Jobs can be triggered by schedule, by file arrival and by the completion of upstream work.
        verify: >-
          Each trigger type is exercised by a test job.
      - id: CAP-ORCHESTRATION.3
        level: MUST
        text: >-
          Each run has a budget. Work beyond the budget is re-triggered by a finishing step that re-queues only if work remains and the run made progress, and a run with nothing to do exits within seconds on the cheapest compute.
        verify: >-
          Feed more work than one budget allows; the backlog drains without manual triggers, and an empty run costs seconds.
      - id: CAP-ORCHESTRATION.4
        level: MUST
        text: >-
          Retries are safe because every task is idempotent; the orchestrator also rejects a duplicate run identifier.
        verify: >-
          Re-run a completed task; outputs are byte-identical.
      - id: CAP-ORCHESTRATION.5
        level: MUST
        text: >-
          A job can be re-run for a declared range of partitions, with a limit on concurrent runs.
        verify: >-
          Run a range backfill; only the declared partitions change.
      - id: CAP-ORCHESTRATION.6
        level: MUST
        text: >-
          Alerts fire on data freshness, not only on job failure.
        verify: >-
          Stop an upstream source; a freshness alert fires within its window.

  - id: CAP-TRANSFORMATION
    name: Transformation layer
    domain: data
    layer: L3
    summary: >-
      Versioned, tested models from bronze to silver to gold; the only place measures are computed.
    depends_on: [CAP-COMPUTE, CAP-CATALOG]
    clauses:
      - id: CAP-TRANSFORMATION.1
        level: MUST
        text: >-
          Models are versioned SQL (or equivalent) in bronze, silver and gold tiers, with tests that run in CI.
        verify: >-
          CI builds and tests the models on every change.
      - id: CAP-TRANSFORMATION.2
        level: MUST
        text: >-
          Conformance happens once, in silver: each entity has one identifier shared by every consumer.
        verify: >-
          Gold models join on silver identifiers only.
      - id: CAP-TRANSFORMATION.3
        level: MUST
        text: >-
          No measure or report value is computed in an application; applications select and format gold.
        verify: >-
          A test forbids the application's reporting code from opening a database connection to operational tables.
      - id: CAP-TRANSFORMATION.4
        level: MUST
        text: >-
          Development runs write to development schemas inside the production catalog, which no consumer is granted.
        verify: >-
          Development schemas carry no consumer grants.
      - id: CAP-TRANSFORMATION.5
        level: SHOULD
        text: >-
          Gold stores counts and sums, not ratios, so measures re-aggregate correctly.
        verify: >-
          Review gold columns; ratios are computed in the semantic layer.
      - id: CAP-TRANSFORMATION.6
        level: MUST
        text: >-
          Silver keeps effective-dated history for every relationship that changes over time (enrolment, posting, guardianship, programme), with valid-from, valid-to and recorded-at, and gold is computed as at a declared reference date.
        verify: >-
          Silver relationship tables carry the three time columns; each gold model names its reference-date rule.
      - id: CAP-TRANSFORMATION.7
        level: MUST
        text: >-
          A document about one record, such as a certificate, transcript or letter, may be produced by an application from operational data; any aggregate it prints (a rank, an average) comes from gold or the semantic layer.
        verify: >-
          Document templates read aggregates only through the semantic layer or gold.
      - id: CAP-TRANSFORMATION.8
        level: SHOULD
        text: >-
          Credentials issued about a single record, such as certificates and transcripts, are W3C Verifiable Credentials 2.0, using Open Badges 3.0 or CLR 2.0 where they fit.
        verify: >-
          An issued credential fixture verifies with a standard verifier.

  - id: CAP-SEMANTICS
    name: Semantic layer
    domain: data
    layer: L1
    summary: >-
      Every measure defined once, versioned, and read by every consumer.
    depends_on: [CAP-TRANSFORMATION]
    clauses:
      - id: CAP-SEMANTICS.1
        level: MUST
        text: >-
          Each measure and dimension is defined once, in version control, per domain.
        verify: >-
          No measure name has two definitions.
      - id: CAP-SEMANTICS.2
        level: MUST
        text: >-
          Dashboards, natural-language queries and agents read measures through the semantic layer.
        verify: >-
          Dashboard and agent queries reference semantic-layer objects, not raw gold columns.
      - id: CAP-SEMANTICS.3
        level: MUST
        text: >-
          Each indicator carries metadata saying what it means and how to read it, how it is computed (numerator and denominator as separate measures, unit, reference-date rule), how it may be broken down, where its counts come from and how often, what coverage it needs before publication, and who owns which version of it.
        verify: >-
          A check finds no indicator with a missing metadata field.
      - id: CAP-SEMANTICS.4
        level: SHOULD
        text: >-
          An indicator with an international definition follows the UIS Official List of SDG 4 Indicators and the UIS education glossary, records the edition it follows, and documents any deviation in its metadata.
        verify: >-
          Indicators that map to international definitions name them; deviations are listed.
      - id: CAP-SEMANTICS.5
        level: MUST
        text: >-
          A denominator from outside the platform, such as a population estimate by age, is versioned reference data that names its source and vintage.
        verify: >-
          Indicators with external denominators reference a versioned reference table.

  - id: CAP-REPORTING
    name: Reporting
    domain: data
    layer: L3
    summary: >-
      Dashboards and natural-language query over the semantic layer, deployed as code.
    depends_on: [CAP-SEMANTICS]
    clauses:
      - id: CAP-REPORTING.1
        level: MUST
        text: >-
          Dashboards are deployed as code, rendered per environment from the deployment tool's resolved output.
        verify: >-
          Each dashboard's source is in a repository; no environment-specific literal is in it.
      - id: CAP-REPORTING.2
        level: MUST
        text: >-
          A dashboard shows each viewer only the rows and columns that viewer may see, or runs as a declared identity whose access is the dashboard's audience.
        verify: >-
          Open a dashboard as two scoped users; each sees their own scope.
      - id: CAP-REPORTING.3
        level: SHOULD
        text: >-
          Natural-language query is offered over the semantic layer, showing the query it ran.
        verify: >-
          Every answer displays its generated query.

  - id: CAP-APPS
    name: Application hosting
    domain: data
    layer: L3
    summary: >-
      Product interfaces deployed by CI, behind sign-in, that say which environment they are in.
    depends_on: [CAP-NETWORK, CAP-DELIVERY]
    clauses:
      - id: CAP-APPS.1
        level: MUST
        text: >-
          Applications sit behind identity-provider sign-in and reach data services privately.
        verify: >-
          See CAP-NETWORK.1 and CAP-NETWORK.2 for each application host.
      - id: CAP-APPS.2
        level: MUST
        text: >-
          A health endpoint reports the environment the application believes it is in: target, catalog and schema, database branch and schema version, and build version.
        verify: >-
          Query the endpoint in each environment; every field matches the environment.
      - id: CAP-APPS.3
        level: MUST
        text: >-
          Application interfaces are versioned and change additively; a changed shape is a new route.
        verify: >-
          A pinned interface snapshot is compared in CI; removals fail.
      - id: CAP-APPS.4
        level: MUST
        text: >-
          Applications are deployed by CI from a versioned image or artefact.
        verify: >-
          Running versions match a tag; no image is pushed from a workstation.
      - id: CAP-APPS.5
        level: MUST
        text: >-
          Interfaces used by staff, learners, guardians or the public meet WCAG 2.2 Level AA (also published as ISO/IEC 40500:2025), checked automatically in CI and by a manual audit for each release.
        verify: >-
          An automated accessibility check runs in CI; manual audit findings are tracked.
      - id: CAP-APPS.6
        level: SHOULD
        text: >-
          User-facing text is externalised and translatable, so an interface can be offered in more than one language.
        verify: >-
          No user-facing string is hard-coded outside the translation files.
      - id: CAP-APPS.7
        level: SHOULD
        text: >-
          Data-capture paths work over low bandwidth and tolerate intermittent connectivity.
        verify: >-
          Capture flows are tested under throttled and interrupted network conditions.
      - id: CAP-APPS.8
        level: MUST
        text: >-
          Applications that handle T3 or T4 data meet OWASP ASVS 5.0 Level 2.
        verify: >-
          The application's verification report cites the requirement identifiers it meets.
      - id: CAP-APPS.9
        level: MUST
        text: >-
          Applications sign users in with OpenID Connect through the identity provider, and every OAuth deployment follows the OAuth 2.0 Security Best Current Practice (RFC 9700).
        verify: >-
          The sign-in configuration is reviewed against RFC 9700; implicit and password grants are disabled.

  - id: CAP-QUALITY
    name: Data quality
    domain: data
    layer: L3
    summary: >-
      Checks at every tier; failing data is quarantined, never used.
    depends_on: [CAP-TRANSFORMATION]
    clauses:
      - id: CAP-QUALITY.1
        level: MUST
        text: >-
          Each tier has checks, and data that fails a blocking check does not reach consumers; it is quarantined with a reason.
        verify: >-
          Inject a failing row; it appears in quarantine and not in gold.
      - id: CAP-QUALITY.2
        level: MUST
        text: >-
          Refused input and system failure are counted and reported separately.
        verify: >-
          Metrics distinguish the two; each has its own alert.
      - id: CAP-QUALITY.3
        level: SHOULD
        text: >-
          Each source has a declared contract (schema, keys, freshness) checked on arrival.
        verify: >-
          Change a source's schema in a test; arrival checks fail loudly.
      - id: CAP-QUALITY.4
        level: MUST
        text: >-
          Every check names the ISO/IEC 25012 data-quality characteristic it measures (for example accuracy, completeness, consistency, credibility or currentness) and its severity.
        verify: >-
          The check registry has a dimension and severity for every check.
      - id: CAP-QUALITY.5
        level: MUST
        text: >-
          An error found after load is fixed by a correction request approved by the data's steward; the correction lands as a new version, never an edit in place, and the request is kept with the record.
        verify: >-
          A correction fixture produces a new version linked to its request; the old version stays readable.
      - id: CAP-QUALITY.6
        level: SHOULD
        text: >-
          Checks that compare two sources which should agree are declared as blocking or warning.
        verify: >-
          Each cross-source check states its effect.

  - id: CAP-LINEAGE
    name: Lineage
    domain: data
    layer: L1
    summary: >-
      Which inputs produced which outputs, captured as work runs.
    depends_on: [CAP-CATALOG]
    clauses:
      - id: CAP-LINEAGE.1
        level: MUST
        text: >-
          Table-level lineage is captured automatically for every job and transformation run.
        verify: >-
          For a gold table, lineage lists its upstream tables without manual entry.
      - id: CAP-LINEAGE.2
        level: SHOULD
        text: >-
          Column-level lineage is captured where the engine supports it.
        verify: >-
          For a masked column, lineage shows the source column.
      - id: CAP-LINEAGE.3
        level: SHOULD
        text: >-
          Lineage is emitted as OpenLineage events, so lineage from different implementations can be compared.
        verify: >-
          Job runs emit OpenLineage run events.

  - id: CAP-OBSERVABILITY
    name: Operational telemetry
    domain: data
    layer: L1
    summary: >-
      Per-item metrics, freshness and cost, reaching gold so cost can be told apart from work.
    clauses:
      - id: CAP-OBSERVABILITY.1
        level: MUST
        text: >-
          Work records metrics per item, starting with a status of crashed that is overwritten on success, so a crashed item is never silently missing.
        verify: >-
          Kill a run mid-item; the item's metric reads crashed.
      - id: CAP-OBSERVABILITY.2
        level: MUST
        text: >-
          Cost is attributable to the task that caused it, and reaches gold beside throughput.
        verify: >-
          A gold model reports cost per task per period with item counts.
      - id: CAP-OBSERVABILITY.3
        level: MUST
        text: >-
          Health is judged from heartbeats and fresh output, not from process status.
        verify: >-
          A hung process with a live status is detected by its stale heartbeat.

  - id: CAP-MASTERDATA
    name: Master data and identifiers
    domain: data
    layer: L1
    summary: >-
      One authoritative registry per core resource, with permanent opaque identifiers and governed duplicate resolution.
    depends_on: [CAP-CATALOG, CAP-OPERATIONALDB]
    clauses:
      - id: CAP-MASTERDATA.1
        level: MUST
        text: >-
          Each core resource (institution, site, person, post) has one authoritative registry with one owning steward; other domains reference it by identifier and never copy it.
        verify: >-
          Every reference to a core resource is a foreign key to its registry.
      - id: CAP-MASTERDATA.2
        level: MUST
        text: >-
          Identifiers are opaque, permanent surrogates minted by one authority, never reused, and carry no meaning about the thing they identify.
        verify: >-
          The identifier pattern is declared and tested; no part of an identifier can be decoded into an attribute.
      - id: CAP-MASTERDATA.3
        level: MUST
        text: >-
          Identifiers issued by other authorities are attributes in a separate identifier table with type, issuer and validity, classified at least T3, and never used as keys or carried into gold or shared tables.
        verify: >-
          No gold or shared table has an external-identifier column.
      - id: CAP-MASTERDATA.4
        level: MUST
        text: >-
          A learner keeps one identifier across institutions, levels and years; the institution belongs to the enrolment, not to the identifier.
        verify: >-
          A transfer fixture keeps the learner's identifier.
      - id: CAP-MASTERDATA.5
        level: MUST
        text: >-
          Duplicate detection is deterministic and explainable; uncertain matches go to a person; a merge keeps a surviving identifier and a redirect from each retired one, is audited, and can be reversed. Nothing is deleted.
        verify: >-
          A merge and unmerge fixture round-trips; references to a retired identifier resolve to the survivor.
      - id: CAP-MASTERDATA.6
        level: MUST
        text: >-
          Verification against an external authoritative register goes through an adapter, and its outcome (verified, unverified or mismatch, with date and method) is recorded per record, never inferred.
        verify: >-
          Each verified record carries an outcome, date and method.
      - id: CAP-MASTERDATA.7
        level: MUST
        text: >-
          Changes to an institution (renaming, merger, split, closure, change of ownership) are effective-dated events that keep its history.
        verify: >-
          A merger fixture leaves both histories queryable.
      - id: CAP-MASTERDATA.8
        level: MUST
        text: >-
          A status that ends a person's participation (deceased, left the system) stops outreach and relationship-based access without deleting history.
        verify: >-
          A fixture with that status receives no notices and grants no guardian access.
      - id: CAP-MASTERDATA.9
        level: SHOULD
        text: >-
          Identifiers that people transcribe by hand carry a check digit.
        verify: >-
          The identifier generator and validator implement the check digit.

  # ---------------------------------------------------------------- governance
  - id: CAP-IDENTITY
    name: Identity and groups
    domain: governance
    layer: L1
    summary: >-
      One identity provider for people and groups, synchronised automatically, with break-glass access held apart.
    clauses:
      - id: CAP-IDENTITY.1
        level: MUST
        text: >-
          The organisation's identity provider is the only source of users, groups and membership, synchronised to every platform service automatically.
        verify: >-
          No platform service has a locally created user or group except break-glass accounts.
      - id: CAP-IDENTITY.2
        level: MUST
        text: >-
          Group names are frozen once created, because renames do not propagate reliably.
        verify: >-
          The group declarations forbid renames (a rename is a new group plus migration).
      - id: CAP-IDENTITY.3
        level: MUST
        text: >-
          Two break-glass accounts exist, outside the identity provider's normal sign-in, protected by hardware keys, monitored on every use.
        verify: >-
          Sign-in by either account raises an alert.
      - id: CAP-IDENTITY.4
        level: MUST
        text: >-
          Indirect administrator paths (a directory role that becomes a platform administrator, a resource role that grants workspace administration) are closed or monitored.
        verify: >-
          The access review lists each such path and its control.
      - id: CAP-IDENTITY.5
        level: MUST
        text: >-
          Administrators and every role that can read identifiable or special-category data (T3, T4) authenticate at NIST SP 800-63-4 authentication assurance level 2 or higher with a phishing-resistant authenticator, such as a WebAuthn passkey; platform administrators and holders of the root of trust authenticate at level 3.
        verify: >-
          Sign-in policy for those roles requires it; a sign-in without it is refused.
      - id: CAP-IDENTITY.6
        level: MUST
        text: >-
          Learners, guardians and members of the public authenticate through a separate external identity tenant or portal, and are never members of platform groups.
        verify: >-
          No platform group contains an external identity.

  - id: CAP-REFERENCE
    name: Reference data and data dictionary
    domain: governance
    layer: L1
    summary: >-
      Governed code lists, a versioned data dictionary and common formats, so every value means the same thing everywhere.
    depends_on: [CAP-CATALOG]
    clauses:
      - id: CAP-REFERENCE.1
        level: MUST
        text: >-
          Every coded attribute references a governed code list with an owner, a version and a validity period; a code is retired, never reused or redefined.
        verify: >-
          A check finds no coded column without a code list and no code redefined across versions.
      - id: CAP-REFERENCE.2
        level: MUST
        text: >-
          Changes to code lists and element definitions are reviewed changes approved by the owning steward; each is versioned and announced to the people who use it before it takes effect.
        verify: >-
          Each code-list or definition change traces to an approved change and a notice.
      - id: CAP-REFERENCE.3
        level: MUST
        text: >-
          Every published element is registered in the catalog's data dictionary following the ISO/IEC 11179 model: the concept it represents and its definition, its value domain (data type, format and code list), and its registration status, version and steward.
        verify: >-
          A fitness function finds no gold column with missing dictionary fields.
      - id: CAP-REFERENCE.4
        level: MUST
        text: >-
          Local classifications carry versioned crosswalks to the international classifications used for reporting (ISCED 2011 for levels of education, ISCED-F 2013 for fields, ISCED-T 2021 for teacher-training programmes), and each crosswalk is tested to map every local code.
        verify: >-
          Each crosswalk's test maps every local code.
      - id: CAP-REFERENCE.5
        level: MUST
        text: >-
          Administrative geography is versioned: a boundary change creates a new version and keeps the old, so a time series can be restated on either.
        verify: >-
          Two boundary versions coexist and each resolves its own codes.
      - id: CAP-REFERENCE.6
        level: MUST
        text: >-
          Value formats are fixed in the data dictionary and enforced at entry and at load: timestamps follow RFC 3339 with an explicit offset (with RFC 9557 time-zone names where local civil time matters); amounts are fixed-point decimals with an ISO 4217 currency code; telephone numbers follow ITU-T E.164; countries use ISO 3166-1; languages use BCP 47 tags; text is UTF-8 in Unicode Normalization Form C; coordinates declare their reference system.
        verify: >-
          Each format in the dictionary has a validation rule used at entry and at load.
      - id: CAP-REFERENCE.7
        level: SHOULD
        text: >-
          A value outside its code list is quarantined with a reason rather than coerced to a catch-all code.
        verify: >-
          An unknown-code fixture lands in quarantine.
      - id: CAP-REFERENCE.8
        level: SHOULD
        text: >-
          Code lists maintained by outside agencies (countries, currencies, languages) are loaded on a schedule, versioned, and recorded with their source and retrieval date.
        verify: >-
          Each external code list has a load job and a recorded source and retrieval date.

  - id: CAP-ACCESS
    name: Access model
    domain: governance
    layer: L1
    summary: >-
      Role decides reach, entitlements decide rows, classification decides columns.
    depends_on: [CAP-IDENTITY, CAP-CATALOG, CAP-CLASSIFICATION]
    clauses:
      - id: CAP-ACCESS.1
        level: MUST
        text: >-
          Reach (which catalogs and actions) is granted to identity-provider groups by role.
        verify: >-
          Every grant's principal is a group mapped to a role.
      - id: CAP-ACCESS.2
        level: MUST
        text: >-
          Row scope comes from an entitlement table derived from an authoritative feed (for example staff postings), with a validity period, never edited by hand.
        verify: >-
          The entitlement table is written only by its loader; a manual write is refused.
      - id: CAP-ACCESS.3
        level: MUST
        text: >-
          Row and column policies only narrow access. Each user and table resolves to exactly one row filter and each column to at most one mask; an ambiguity fails the query rather than choosing.
        verify: >-
          Test a user matching two filters; the query fails.
      - id: CAP-ACCESS.4
        level: MUST
        text: >-
          Only pipeline identities are exempt from policies, each exemption listed with its reason.
        verify: >-
          The exemption list contains only workload identities, each with a reason.
      - id: CAP-ACCESS.5
        level: MUST
        text: >-
          Access to identifiable columns is through a time-boxed, audited group.
        verify: >-
          Membership of the group expires; each grant appears in audit.
      - id: CAP-ACCESS.6
        level: MUST
        text: >-
          Reach, row scope and classification are each changed by a different owner, so no single change widens access across all three.
        verify: >-
          The owners of the group declarations, the entitlement feed and the classification rules are different roles.
      - id: CAP-ACCESS.7
        level: MUST
        text: >-
          Row scope may also come from a relationship (the record is the person's own, or the person is a guardian with verified authority), taken from the authoritative relationship record, effective-dated, and ended when the relationship or the authority ends.
        verify: >-
          Ending a guardian relationship removes access at the next query.
      - id: CAP-ACCESS.8
        level: MUST
        text: >-
          A view for a data subject or guardian exposes a declared, minimal set of columns per record class; designated special-category fields are excluded from guardian views by default, with the reason recorded.
        verify: >-
          Subject-facing views are declared in code with their column lists and exclusions.

  - id: CAP-CLASSIFICATION
    name: Classification and provenance
    domain: governance
    layer: L1
    summary: >-
      Every table and column is classified by sensitivity and tagged with provenance from the moment it lands.
    depends_on: [CAP-CATALOG]
    clauses:
      - id: CAP-CLASSIFICATION.1
        level: MUST
        text: >-
          Every table carries a classification (T0 public aggregate, T1 internal, T2 de-identified, T3 identifiable, T4 special category) and a provenance (real, simulated, derived).
        verify: >-
          The daily fitness function finds no untagged table.
      - id: CAP-CLASSIFICATION.2
        level: MUST
        text: >-
          Data not yet classified is blocked by default until classification has run.
        verify: >-
          A new unclassified table is unreadable by analysts.
      - id: CAP-CLASSIFICATION.3
        level: MUST
        text: >-
          T4 data lives in its own catalog and storage, and each grant on it is approved by its steward.
        verify: >-
          T4 tables exist only in the T4 catalog; its grants trace to approvals.
      - id: CAP-CLASSIFICATION.4
        level: MUST
        text: >-
          Tags are applied where data enters (landing and bronze), not added at gold.
        verify: >-
          Bronze tables carry the tags.
      - id: CAP-CLASSIFICATION.5
        level: MUST
        text: >-
          Simulated data lives only in sandbox catalogs, and derived data is built only from tagged tables.
        verify: >-
          No table tagged simulated is outside a sandbox catalog.
      - id: CAP-CLASSIFICATION.6
        level: MUST
        text: >-
          Attributes follow a default classification by kind: data that identifies or locates a person is at least T3; special-category data under the applicable data-protection law, and child-protection and wellbeing records, are T4. Exceptions are recorded with a reason.
        verify: >-
          A check compares column classifications with the default table and lists exceptions.
      - id: CAP-CLASSIFICATION.7
        level: MUST
        text: >-
          Every personal-data element declares its purpose and legal basis in the catalog; an element with no consuming process or measure at its periodic review is proposed for removal.
        verify: >-
          A report lists personal-data elements without a purpose or without a consumer.

  - id: CAP-AUDIT
    name: Audit
    domain: governance
    layer: L1
    summary: >-
      Every access and administrative action recorded, retained beyond the platform default, readable by auditors only.
    depends_on: [CAP-IDENTITY]
    clauses:
      - id: CAP-AUDIT.1
        level: MUST
        text: >-
          Every data access and every administrative action is recorded with principal, object, action and time.
        verify: >-
          A test read and a test grant both appear in audit.
      - id: CAP-AUDIT.2
        level: MUST
        text: >-
          Audit is copied to a separate store with retention set by policy, beyond the platform's own retention, and is readable only by auditors.
        verify: >-
          The copy holds records older than the platform's retention; a non-auditor read is refused.
      - id: CAP-AUDIT.3
        level: SHOULD
        text: >-
          Query text is recorded only when a case needs it, because query text can contain personal data.
        verify: >-
          Verbose audit is off by default; turning it on is a reviewed change.
      - id: CAP-AUDIT.4
        level: MUST
        text: >-
          Access to identifiable or special-category records (T3, T4) records a purpose chosen from a declared list, as well as principal, object, action and time.
        verify: >-
          Audit rows for T3 and T4 reads carry a purpose.
      - id: CAP-AUDIT.5
        level: SHOULD
        text: >-
          Anomalous access to T3 and T4 data (unusual volume, time or scope outside the entitlement) raises an alert.
        verify: >-
          A simulated out-of-scope read raises an alert.

  - id: CAP-RECORDS
    name: Records lifecycle and data-subject rights
    domain: governance
    layer: L1
    summary: >-
      Every record has a retention class; archiving, disposal, subject access, rectification and individual disclosure follow declared, audited paths.
    depends_on: [CAP-CLASSIFICATION, CAP-MASTERDATA, CAP-AUDIT]
    clauses:
      - id: CAP-RECORDS.1
        level: MUST
        text: >-
          A retention schedule in code gives each record class its retention period, trigger event, legal basis and owning role, and every table and file belongs to a record class.
        verify: >-
          A fitness function finds no table or file without a record class.
      - id: CAP-RECORDS.2
        level: MUST
        text: >-
          When a record's retention trigger occurs, the record leaves operational use and moves to a read-only archive.
        verify: >-
          A leaver fixture appears in the archive and is read-only.
      - id: CAP-RECORDS.3
        level: MUST
        text: >-
          Disposal at the end of retention is a reviewed, audited operation that reaches table history, branches and backups within a stated maximum time; where history cannot be rewritten, per-subject or per-partition keys are destroyed. This is the only path by which real personal data is deleted.
        verify: >-
          A disposal fixture leaves no readable copy in any store within the stated time; the audit shows the review.
      - id: CAP-RECORDS.4
        level: MUST
        text: >-
          Any record class kept without limit is listed as such in the schedule, with the reason.
        verify: >-
          The schedule lists the permanent classes explicitly.
      - id: CAP-RECORDS.5
        level: MUST
        text: >-
          A subject-access request is answered from the catalog by the person's identifier across all domains, and the answer is reproducible.
        verify: >-
          Two runs of a subject-access fixture return identical results.
      - id: CAP-RECORDS.6
        level: MUST
        text: >-
          A rectification is an evented correction that creates a new version, and downstream tables are rebuilt from it.
        verify: >-
          After a rectification fixture, gold reflects the corrected value and the history shows both.
      - id: CAP-RECORDS.7
        level: MUST
        text: >-
          Releasing an individual's records to that person, a guardian with verified authority, or an authorised agency is a logged request that records who received what, why, on what basis and how; it is separate from statistical publication, which never releases individual records.
        verify: >-
          The disclosure register has an entry for each release with all fields.

  - id: CAP-SHARING
    name: Publication and sharing
    domain: governance
    layer: L1
    summary: >-
      External parties receive de-identified tables from a publication catalog over an open protocol, each share approved and registered.
    depends_on: [CAP-CATALOG, CAP-CLASSIFICATION, CAP-TRANSFORMATION]
    clauses:
      - id: CAP-SHARING.1
        level: MUST
        text: >-
          Data leaves the platform only from a publication catalog of de-identified or aggregated materialised tables.
        verify: >-
          Every share's objects are in the publication catalog.
      - id: CAP-SHARING.2
        level: MUST
        text: >-
          Published tables enforce a minimum cell size by test, and replace identifiers with keyed hashes or surrogate keys, never unsalted hashes.
        verify: >-
          Publication models carry cell-size tests; no identifier column is an unkeyed hash.
      - id: CAP-SHARING.3
        level: MUST
        text: >-
          Sharing uses an open protocol, with recipients authenticated by federation where possible and otherwise by tokens rotated within a year.
        verify: >-
          The recipient register lists each recipient's method and token expiry.
      - id: CAP-SHARING.4
        level: MUST
        text: >-
          Each share is a reviewed change sponsored by a steward, approved by a sharing panel, and listed in a published register.
        verify: >-
          Every live share traces to an approved change and a register entry.
      - id: CAP-SHARING.5
        level: MUST
        text: >-
          Shares name explicit tables, never whole schemas, and share no table history.
        verify: >-
          No share includes a schema; shared tables have history sharing off.
      - id: CAP-SHARING.6
        level: SHOULD
        text: >-
          Researchers who need finer data work inside the platform, on a project basis, time-boxed.
        verify: >-
          Research grants carry a project and an expiry.

  - id: CAP-PUBLICATION
    name: Open statistical publication
    domain: governance
    layer: L1
    summary: >-
      Aggregate statistics published openly with disclosure control, permanent identifiers and open metadata.
    depends_on: [CAP-SEMANTICS, CAP-CLASSIFICATION, CAP-REFERENCE]
    clauses:
      - id: CAP-PUBLICATION.1
        level: MUST
        text: >-
          Only T0 aggregates are published openly; open datasets may be read without signing in, are rate-limited, and each is listed in a publication register.
        verify: >-
          Every open dataset is T0 and has a register entry.
      - id: CAP-PUBLICATION.2
        level: MUST
        text: >-
          Published tables apply disclosure control using methods from the Handbook on Statistical Disclosure Control: a minimum cell size, secondary suppression so suppressed cells cannot be derived, and rounding or perturbation where declared, with small populations treated as high risk. The method is published as metadata.
        verify: >-
          Publication models carry disclosure tests, including a test that suppressed cells cannot be recomputed from totals.
      - id: CAP-PUBLICATION.3
        level: MUST
        text: >-
          Each published dataset has a permanent identifier and stable address; new periods are appended, and a revision is a new version with the previous one still retrievable.
        verify: >-
          An earlier version of a revised dataset can still be fetched by its identifier.
      - id: CAP-PUBLICATION.4
        level: MUST
        text: >-
          Published datasets carry DCAT 3 metadata, with schema.org Dataset markup on each landing page and CSV on the Web metadata beside every CSV file, all generated from the data dictionary; they use the governed code lists and attach the metadata of every indicator they contain.
        verify: >-
          A metadata validator passes on every published dataset.
      - id: CAP-PUBLICATION.5
        level: SHOULD
        text: >-
          Bulk files, a query interface and human-readable renderings are all generated from the same publication table.
        verify: >-
          Each output names the publication table it was rendered from.
      - id: CAP-PUBLICATION.6
        level: MUST
        text: >-
          Geospatial outputs are published as GeoJSON (RFC 7946) or through OGC API – Features with a declared coordinate reference system; locations of institutions may be published, locations of people never are.
        verify: >-
          No published dataset contains a person's location.
      - id: CAP-PUBLICATION.7
        level: SHOULD
        text: >-
          Statistics exchanged with international bodies use SDMX 3.0 or later, or SDMX 2.1 where the receiving agency requires it.
        verify: >-
          International returns are produced in the declared exchange format.
      - id: CAP-PUBLICATION.8
        level: SHOULD
        text: >-
          Differential privacy is used only where it fits (query services over the same base data, or synthetic files) and is evaluated and documented following NIST SP 800-226, stating the unit of privacy and the total privacy-loss budget.
        verify: >-
          Each differentially private release records its unit, budget and evaluation.
      - id: CAP-PUBLICATION.9
        level: SHOULD
        text: >-
          The international education questionnaires (the UIS Survey of Formal Education) are completed from gold through the semantic layer, not assembled by hand.
        verify: >-
          Each questionnaire table traces to semantic-layer measures.

  # ---------------------------------------------------------------- movement
  - id: CAP-ENVIRONMENTS
    name: Environments by branching
    domain: movement
    layer: L1
    summary: >-
      An environment is a template plus values; development is isolated inside production by branching.
    depends_on: [CAP-OPERATIONALDB, CAP-CATALOG]
    clauses:
      - id: CAP-ENVIRONMENTS.1
        level: MUST
        text: >-
          An environment is one template plus one values file, and every axis agrees which environment it is: catalog and schema, database branch and database, application identity and configuration, and jobs.
        verify: >-
          Each application's health endpoint (CAP-APPS.2) matches its values file.
      - id: CAP-ENVIRONMENTS.2
        level: MUST
        text: >-
          Without a funded development environment, development is isolated inside production: database branches, and development schemas in production catalogs with no consumer grants.
        verify: >-
          Development objects exist only as branches and ungranted schemas.
      - id: CAP-ENVIRONMENTS.3
        level: MUST
        text: >-
          A branch never writes to production object storage. Branches use their own storage, and may read production storage only through a read-only path.
        verify: >-
          A write to production storage from a branch's identity is refused.
      - id: CAP-ENVIRONMENTS.4
        level: MUST
        text: >-
          Each change under review gets its own branch and development schemas with a time to live, removed when the change merges.
        verify: >-
          After merge, the change's branch and schemas are gone.
      - id: CAP-ENVIRONMENTS.5
        level: MUST
        text: >-
          Grants and identities are declared per environment; the same configuration never implies the same securable.
        verify: >-
          Each environment's grants are listed separately in its plan.

  - id: CAP-BACKFILL
    name: Backfill and reprocessing
    domain: movement
    layer: L3
    summary: >-
      Loading history, reprocessing and filling gaps are idempotent, bounded, rehearsed and reconciled.
    depends_on: [CAP-ORCHESTRATION, CAP-ENVIRONMENTS, CAP-QUALITY]
    clauses:
      - id: CAP-BACKFILL.1
        level: MUST
        text: >-
          A backfill declares its range and writes by replacing exactly that range or merging on a natural key, so running it twice gives the same result.
        verify: >-
          Run the backfill twice; content hashes of the range match and rows outside it are unchanged.
      - id: CAP-BACKFILL.2
        level: MUST
        text: >-
          Every output row records the logic version and run that produced it, and event time separately from load time.
        verify: >-
          Restated rows show the new logic version; event and load time columns are both present.
      - id: CAP-BACKFILL.3
        level: MUST
        text: >-
          A backfill runs first on a branch or an unpublished copy, is audited there, and is published only after it passes.
        verify: >-
          The run log shows write, audit and publish steps in that order.
      - id: CAP-BACKFILL.4
        level: MUST
        text: >-
          A backfill is reconciled against its source by row counts, sums and content hashes per partition.
        verify: >-
          The reconciliation report exists and matches for every partition.
      - id: CAP-BACKFILL.5
        level: MUST
        text: >-
          A backfill is bounded and throttled so that production work and the source system keep their service levels.
        verify: >-
          Production latency and source load stay within objectives during the backfill.
      - id: CAP-BACKFILL.6
        level: MUST
        text: >-
          A backfill never overwrites fresher data or a human decision.
        verify: >-
          Test with a row updated after the backfill's snapshot and a human-ruled row; both survive.
      - id: CAP-BACKFILL.7
        level: MUST
        text: >-
          Source rows that fail quality checks are quarantined with a reason, never dropped.
        verify: >-
          Counts reconcile as loaded plus quarantined equals extracted.
      - id: CAP-BACKFILL.8
        level: MUST
        text: >-
          Incremental extraction tolerates late commits and clock skew, with an overlap window into an idempotent sink or a cursor in commit order.
        verify: >-
          Commit a row whose timestamp is behind the watermark; it is still loaded.

  - id: CAP-MIGRATION
    name: Migration and decommission
    domain: movement
    layer: L1
    summary: >-
      Moving between platforms or accounts without loss, with a fallback window and two-role sign-off.
    depends_on: [CAP-OPERATIONALDB, CAP-CLASSIFICATION]
    clauses:
      - id: CAP-MIGRATION.1
        level: MUST
        text: >-
          Lake data is moved by re-binding its storage to the new platform where possible; derived tables are rebuilt by their pipelines rather than copied.
        verify: >-
          The migration plan lists each dataset as re-bound or rebuilt.
      - id: CAP-MIGRATION.2
        level: MUST
        text: >-
          An operational database moves by a rehearsed sequence: freeze writes, snapshot, dump, restore in one transaction, verify (row counts, per-table content hashes, sequences, policies, grants, migration ledger), repoint, unfreeze.
        verify: >-
          The rehearsal and the production run each leave a verification report that matches.
      - id: CAP-MIGRATION.3
        level: MUST
        text: >-
          After cutover the old platform stays read-only for a fallback window (the reference value is 60 days), with history expiry held, until a restore drill passes on the new one.
        verify: >-
          Expiry jobs on the old platform are paused for the window; the drill report exists.
      - id: CAP-MIGRATION.4
        level: MUST
        text: >-
          Cutover, rollback and decommission need sign-off from both the Data Lead and the Technical Lead; either may halt.
        verify: >-
          The decommission record carries both sign-offs.
      - id: CAP-MIGRATION.5
        level: MUST
        text: >-
          Before any drop or decommission, each object's provenance is proved from first-hand evidence, audit is archived, and an immutable archive exists with a tested retrieval. Deletion is a plain delete, never a forced one.
        verify: >-
          The retirement tool refuses objects not tagged simulated or derived; the archive retrieval test has passed.

  # ---------------------------------------------------------------- product
  - id: CAP-PIPELINE
    name: Retryable pipeline
    domain: product
    layer: L3
    summary: >-
      Content-addressed, deterministic stages that hand off through storage and can retry while the database is down.
    depends_on: [CAP-ORCHESTRATION, CAP-STORAGE]
    clauses:
      - id: CAP-PIPELINE.1
        level: MUST
        text: >-
          An input's identity is the hash of its bytes; duplicates and re-deliveries converge on one record.
        verify: >-
          Submit the same file twice under different names; one record results.
      - id: CAP-PIPELINE.2
        level: MUST
        text: >-
          The same input produces byte-identical output; any randomness is seeded per item from a hash of stable keys.
        verify: >-
          Process a fixed corpus twice; outputs are byte-identical.
      - id: CAP-PIPELINE.3
        level: MUST
        text: >-
          Each stage is its own job, triggered by the output of the stage before it, so no stage can outrun its predecessor.
        verify: >-
          The job graph has one job per stage with storage-arrival triggers.
      - id: CAP-PIPELINE.4
        level: MUST
        text: >-
          Pending work is recomputed from what exists, never consumed from a queue on read, so a failed run strands nothing.
        verify: >-
          Kill a run mid-way; the next run processes the remainder.
      - id: CAP-PIPELINE.5
        level: MUST
        text: >-
          Writes are atomic (write to a temporary name, then move), so a reader never sees a partial output.
        verify: >-
          Code review and a fault-injection test find no partial files.
      - id: CAP-PIPELINE.6
        level: MUST
        text: >-
          Only the publishing stage connects to the operational database; every other stage can retry while it is unavailable.
        verify: >-
          With the database unreachable, upstream stages complete.
      - id: CAP-PIPELINE.7
        level: MUST
        text: >-
          Each item carries a provenance record of every stage that touched it, with versions; a missing stage reads as absent, never invented.
        verify: >-
          Every published item has a provenance record with a field per stage.

  - id: CAP-COLLECTION
    name: Periodic data collection
    domain: product
    layer: L3
    summary: >-
      Returns collected from institutions on a cycle, validated at entry, attested, gated on completeness and frozen at a reference date.
    depends_on: [CAP-MASTERDATA, CAP-QUALITY, CAP-REFERENCE]
    clauses:
      - id: CAP-COLLECTION.1
        level: MUST
        text: >-
          Each collection is a versioned instrument declaring its items, validation rules, reference date, collection window and expected respondents drawn from the registry; a committed version is immutable.
        verify: >-
          Instruments are versioned files; a change after commit creates a new version.
      - id: CAP-COLLECTION.2
        level: MUST
        text: >-
          Validation runs at entry and again on submission; blocking errors prevent submission, warnings need a reason, and results go back to the respondent in machine-readable form with their severity.
        verify: >-
          A fixture with a blocking error cannot be submitted; one with a warning requires a reason.
      - id: CAP-COLLECTION.3
        level: MUST
        text: >-
          A return moves through declared states (not started, in progress, submitted, attested by the head of the institution, queried, accepted, locked), and each transition is an event recording the role that made it.
        verify: >-
          The event log of a fixture return shows every transition with its role.
      - id: CAP-COLLECTION.4
        level: MUST
        text: >-
          Figures for an area are released only when its expected respondents balance against accepted returns; otherwise the area reads BLOCKED.
        verify: >-
          An area with a missing return reads BLOCKED.
      - id: CAP-COLLECTION.5
        level: MUST
        text: >-
          Official figures are computed from a locked snapshot as at the reference date and carry its version; a revision is a new version with a reason, and both remain readable.
        verify: >-
          A revised figure shows both versions and the reason.
      - id: CAP-COLLECTION.6
        level: MUST
        text: >-
          Imputed values are flagged per cell and never mixed silently with reported ones.
        verify: >-
          Every imputed cell carries a flag in silver and gold.
      - id: CAP-COLLECTION.7
        level: SHOULD
        text: >-
          Forms are prefilled from the registry and the previous period, so respondents confirm rather than retype.
        verify: >-
          A second-period fixture opens prefilled.
      - id: CAP-COLLECTION.8
        level: SHOULD
        text: >-
          Capture works offline and synchronises later; a re-sent return converges on one record.
        verify: >-
          Submitting the same return twice yields one record.
      - id: CAP-COLLECTION.9
        level: SHOULD
        text: >-
          Completeness and timeliness per submitting unit are themselves reported measures.
        verify: >-
          A gold model reports them per unit and period.
      - id: CAP-COLLECTION.10
        level: SHOULD
        text: >-
          Each stage of a collection names the GSBPM v5.2 sub-process it performs, so the statistical production process can be described in a shared vocabulary.
        verify: >-
          Collection stages are tagged with GSBPM sub-process codes.

  - id: CAP-REVIEW
    name: Human review
    domain: product
    layer: L3
    summary: >-
      Low-confidence results go to people, whose decisions are leased, durable and never overwritten by machines.
    depends_on: [CAP-OPERATIONALDB, CAP-AUDIT]
    clauses:
      - id: CAP-REVIEW.1
        level: MUST
        text: >-
          A result below its confidence threshold is routed to review with a reason code; thresholds live in one configuration module.
        verify: >-
          Grep finds thresholds only in the configuration module; a low-confidence fixture lands in review.
      - id: CAP-REVIEW.2
        level: MUST
        text: >-
          A reviewer claims an item with a lease held as a database key; claim is one statement, expiry is judged at read time, and a commit requires a live lease checked before its first write.
        verify: >-
          A race test with concurrent sessions yields exactly one holder.
      - id: CAP-REVIEW.3
        level: MUST
        text: >-
          A human decision outranks any machine re-delivery or re-run; guards test the condition that would make a write wrong, not a status label.
        verify: >-
          Re-run the pipeline over a reviewed item; the human decision is unchanged.
      - id: CAP-REVIEW.4
        level: MUST
        text: >-
          Decisions are reversed by a compensating action that keeps both records; nothing is deleted.
        verify: >-
          Undo a decision; both the decision and its reversal are present.
      - id: CAP-REVIEW.5
        level: MUST
        text: >-
          Each decision records its kind of attribution (automatic, affirmed, corrected, backfilled) so reporting can tell who or what decided.
        verify: >-
          Reporting groups decisions by attribution.

  - id: CAP-MODELS
    name: Governed analytical models
    domain: product
    layer: L3
    summary: >-
      Predictive models, such as early-warning flags, that advise people, are reproducible, and are checked for unequal error before release.
    depends_on: [CAP-TRANSFORMATION, CAP-REVIEW]
    clauses:
      - id: CAP-MODELS.1
        level: MUST
        text: >-
          A model is versioned with its training data pinned, scoring is deterministic, and every score records the model version.
        verify: >-
          Scoring a fixed input twice gives identical scores with the version attached.
      - id: CAP-MODELS.2
        level: MUST
        text: >-
          A risk flag is advice to a person and never triggers an automatic action on a learner or staff member; the person's decision is recorded with attribution.
        verify: >-
          No downstream process consumes a flag except the review queue.
      - id: CAP-MODELS.3
        level: MUST
        text: >-
          Performance and error rates are reported by sex, area, disability and other declared equity dimensions before release and on a schedule; a model whose disparity exceeds its declared bound is not released.
        verify: >-
          The release record holds the disaggregated evaluation and the bound.
      - id: CAP-MODELS.4
        level: SHOULD
        text: >-
          Each flag shows the signals that raised it.
        verify: >-
          The review view lists the contributing signals for each flag.
      - id: CAP-MODELS.5
        level: MUST
        text: >-
          Before a model that scores learners is released, it is assessed against the UNICEF Guidance on AI and Children, and the assessment is kept with the release.
        verify: >-
          The release record holds the assessment.

  - id: CAP-RELEASE
    name: Reconciliation and release
    domain: product
    layer: L3
    summary: >-
      Results are released per unit only when the unit reconciles against its register.
    depends_on: [CAP-REVIEW]
    clauses:
      - id: CAP-RELEASE.1
        level: MUST
        text: >-
          For each release unit, expected subjects (from an external register) balance against confirmed results; any duplicate, orphan, missing subject, pending identity or absent register reads BLOCKED.
        verify: >-
          Fixtures for each blocking condition read BLOCKED; a balanced unit reads CLEAR.
      - id: CAP-RELEASE.2
        level: MUST
        text: >-
          Results release only on CLEAR, and a release is recorded as the point after which changes are new versions.
        verify: >-
          A change after release creates a new version and leaves the released one intact.
      - id: CAP-RELEASE.3
        level: MUST
        text: >-
          The register is read through an adapter and frozen as an immutable snapshot per sitting; corrections are deterministic, evented operations, never ad-hoc edits.
        verify: >-
          Each sitting references one snapshot; register corrections appear as events.
