<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">LumenOSS: light rising from an open book</title>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17386a"/>
      <stop offset="1" stop-color="#0a1a33"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <!-- User space, so the gradient also paints the vertical ray, whose
         bounding box has no width. -->
    <linearGradient id="sun" x1="0" y1="100" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset="1" stop-color="#ffa62b"/>
    </linearGradient>
  </defs>

  <!-- Field -->
  <rect width="512" height="512" rx="112" fill="url(#night)"/>
  <circle cx="256" cy="300" r="150" fill="url(#glow)"/>

  <!-- Five rays, radial from the sun's centre (256, 300) at 30° steps,
       from radius 100 to 196. -->
  <g stroke="url(#sun)" stroke-width="22" stroke-linecap="round">
    <line x1="256" y1="200" x2="256" y2="104"/>
    <line x1="306" y1="213.4" x2="354" y2="130.3"/>
    <line x1="206" y1="213.4" x2="158" y2="130.3"/>
    <line x1="342.6" y1="250" x2="425.7" y2="202"/>
    <line x1="169.4" y1="250" x2="86.3" y2="202"/>
  </g>

  <!-- Rising sun: a full disc; the book hides its lower half -->
  <circle cx="256" cy="300" r="80" fill="url(#sun)"/>

  <!-- Open book: two pages meeting at a spine -->
  <path d="M256 322 C214 294 158 290 104 304 L104 408 C158 394 214 398 256 426 Z" fill="#ffffff"/>
  <path d="M256 322 C298 294 354 290 408 304 L408 408 C354 394 298 398 256 426 Z" fill="#dfe7f3"/>
</svg>
