# Hugo configuration for the documentation website. Content is not kept
# here: `just site` stages it from docs/ (scripts/site.py) and passes it to
# Hugo with --contentDir, so the Markdown in docs/ stays the single source.

title = "Data platform blueprint"
baseURL = "https://lumenoss.github.io/data-platform-blueprint/"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"

[markup]
  [markup.goldmark.renderer]
    # The theme's shortcodes emit HTML; the docs themselves contain only
    # a few inline <br/> tags in tables and diagrams.
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "ocean"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  [params.header]
    layout = "fixed"
  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true
  [params.homepage]
    layout = "page"
    showRecent = false
  [params.article]
    showDate = false
    showAuthor = false
    showReadingTime = false
    showWordCount = false
    showBreadcrumbs = true
    showTableOfContents = true
    showPagination = false
    showHeadingAnchors = true
    showEdit = false
  [params.list]
    showBreadcrumbs = true
    showTableOfContents = true
    groupByYear = false
    showCards = false

[[menus.main]]
  name = "Getting started"
  pageRef = "/getting-started"
  weight = 10
[[menus.main]]
  name = "Principles"
  pageRef = "/principles"
  weight = 20
[[menus.main]]
  name = "Architecture"
  pageRef = "/architecture"
  weight = 30
[[menus.main]]
  name = "Capabilities"
  pageRef = "/capabilities"
  weight = 40
[[menus.main]]
  name = "Domain"
  pageRef = "/domain"
  weight = 50
[[menus.main]]
  name = "Standards"
  pageRef = "/standards"
  weight = 60
[[menus.main]]
  name = "Decisions"
  pageRef = "/adr"
  weight = 70
[[menus.main]]
  name = "GitHub"
  url = "https://github.com/LumenOSS/data-platform-blueprint"
  weight = 80
