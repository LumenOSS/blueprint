# Hugo configuration for the documentation website. Content is not kept
# here: `just site` stages it from docs/ (scripts/site.py) and passes it to
# Hugo with --contentDir, so the Markdown in docs/ stays the single source.

title = "Data platform blueprint"
baseURL = "https://lumenoss.github.io/data-platform-blueprint/"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
summaryLength = 0

[module]
  [[module.imports]]
    path = "github.com/nunocoracao/blowfish/v3"

[markup]
  [markup.goldmark.renderer]
    # The theme's shortcodes emit HTML; the docs themselves contain only
    # a few inline <br/> tags in tables and diagrams.
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

# One page per section, so every capability card shows at once.
[pagination]
  pagerSize = 100

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  colorScheme = "lumen"
  copyright = "© LumenOSS contributors · Apache License 2.0"
  logo = "img/lumenoss.svg"
  defaultAppearance = "light"
  autoSwitchAppearance = true
  enableSearch = true
  enableCodeCopy = true
  enableStructuredBreadcrumbs = true
  highlightCurrentMenuArea = true
  smartTOC = true
  defaultFeaturedImage = "img/featured.svg"
  mainSections = ["capabilities"]
  [params.header]
    layout = "floating"
    mobileMenuStyle = "dropdown"
  [params.footer]
    showMenu = true
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true
  [params.homepage]
    layout = "landing"
    homepageImage = "img/hero.svg"
    showRecent = false
  [params.article]
    showDate = false
    showAuthor = false
    showReadingTime = true
    showReadingProgress = true
    showWordCount = false
    showHero = true
    heroStyle = "background"
    layoutBackgroundBlur = true
    layoutBackgroundHeaderSpace = true
    showBreadcrumbs = true
    showTableOfContents = true
    showTaxonomies = true
    showPagination = true
    showHeadingAnchors = true
    showZenMode = true
    showEdit = false
    showRelatedContent = false
  [params.list]
    showHero = true
    heroStyle = "background"
    layoutBackgroundBlur = true
    showBreadcrumbs = true
    showSummary = true
    showTableOfContents = true
    showCards = true
    cardView = true
    orderByWeight = true
    groupByYear = false
    constrainItemsWidth = false

[[menus.main]]
  name = "Getting started"
  pageRef = "/getting-started"
  weight = 10
[[menus.main]]
  name = "Principles"
  pageRef = "/principles"
  weight = 20
[[menus.main]]
  name = "Architecture"
  pageRef = "/architecture"
  weight = 30
[[menus.main]]
  name = "Capabilities"
  pageRef = "/capabilities"
  weight = 40
[[menus.main]]
  name = "Domain"
  pageRef = "/domain"
  weight = 50
[[menus.main]]
  name = "Standards"
  pageRef = "/standards"
  weight = 60
[[menus.main]]
  name = "Decisions"
  pageRef = "/adr"
  weight = 70
[[menus.main]]
  name = "GitHub"
  url = "https://github.com/LumenOSS/data-platform-blueprint"
  weight = 80
