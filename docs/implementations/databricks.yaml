# yaml-language-server: $schema=../../schema/binding.schema.json
#
# Reference binding: Databricks on Azure. Every clause is `planned` until the
# implementation repository shows evidence and moves it to `met`.

blueprint:
  version: 0.3.1
implementation:
  name: databricks
  summary: Databricks on Azure, with open formats and open-source tooling where they fit.
  runtime: Azure Databricks and Azure, via OpenTofu and Declarative Automation Bundles
  repository: https://github.com/LumenOSS/data-platform-databricks
bindings:
  - capability: CAP-REPOSITORIES
    components:
      - name: Git with two remotes
        role: GitHub now, Azure DevOps as the target host
      - name: Azure Pipelines
        role: CI host
        licence: proprietary
        alternatives:
          - GitHub Actions
      - name: Nix flake + just
        role: pinned toolchain and task runner
        licence: MIT
    clauses:
      - clause: CAP-REPOSITORIES.1
        status: planned
      - clause: CAP-REPOSITORIES.2
        status: planned
      - clause: CAP-REPOSITORIES.3
        status: planned
      - clause: CAP-REPOSITORIES.4
        status: planned
      - clause: CAP-REPOSITORIES.5
        status: planned
  - capability: CAP-STATE
    components:
      - name: OpenTofu
        role: infrastructure as code
        licence: MPL-2.0
      - name: azurerm backend
        role: blob state in its own storage account, versioned, shared keys off
        licence: proprietary
      - name: Azure Key Vault
        role: state encryption key
        licence: proprietary
    notes: 'Keep state out of the lake storage account: blob versioning is account-wide and conflicts with Delta maintenance there.'
    clauses:
      - clause: CAP-STATE.1
        status: planned
      - clause: CAP-STATE.2
        status: planned
      - clause: CAP-STATE.3
        status: planned
      - clause: CAP-STATE.4
        status: planned
      - clause: CAP-STATE.5
        status: planned
      - clause: CAP-STATE.6
        status: planned
      - clause: CAP-STATE.7
        status: planned
      - clause: CAP-STATE.8
        status: planned
  - capability: CAP-CIIDENTITY
    components:
      - name: Entra workload identity federation
        role: CI token exchanged for an Azure token; user-assigned managed identities
        licence: proprietary
      - name: Databricks OAuth federation policies
        role: CI token exchanged for a Databricks token per service principal
        licence: proprietary
    notes: Databricks allows 20 federation policies per service principal; count before adding.
    clauses:
      - clause: CAP-CIIDENTITY.1
        status: planned
      - clause: CAP-CIIDENTITY.2
        status: planned
      - clause: CAP-CIIDENTITY.3
        status: planned
      - clause: CAP-CIIDENTITY.4
        status: planned
      - clause: CAP-CIIDENTITY.5
        status: planned
      - clause: CAP-CIIDENTITY.6
        status: planned
