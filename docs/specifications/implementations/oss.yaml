# yaml-language-server: $schema=../../../schema/binding.schema.json
#
# Reference binding: open source on Kubernetes. Every clause is `planned` until the
# implementation repository shows evidence and moves it to `met`.

blueprint:
  version: 0.5.0
implementation:
  name: oss
  summary: Open-source components only, on any Kubernetes cluster.
  runtime: Kubernetes via OpenTofu and Helm; kind or k3d on a laptop
  repository: https://github.com/LumenOSS/blueprint-oss
bindings:
  - capability: CAP-REPOSITORIES
    components:
      - name: Git with two remotes
        role: source of truth; mirrored to a second host
      - name: Forgejo Actions
        role: CI host
        licence: GPL-3.0-or-later
        deploy: self-hosted forge
        source: https://forgejo.org/
        alternatives:
          - Woodpecker CI
          - GitHub Actions
          - Azure Pipelines
      - name: Nix flake + just
        role: pinned toolchain and task runner
        licence: MIT
    notes: Forgejo's licence and its OIDC tokens for Actions were not verified (2026-10-15).
    clauses:
      - clause: CAP-REPOSITORIES.1
        status: planned
      - clause: CAP-REPOSITORIES.2
        status: planned
      - clause: CAP-REPOSITORIES.3
        status: planned
      - clause: CAP-REPOSITORIES.4
        status: planned
      - clause: CAP-REPOSITORIES.5
        status: planned
  - capability: CAP-STATE
    components:
      - name: OpenTofu
        role: infrastructure as code with client-side state encryption
        licence: MPL-2.0
        source: https://opentofu.org/
      - name: S3 backend on Ceph RGW
        role: state bucket with versioning and object lock
        licence: LGPL-2.1-or-later
        deploy: Rook
      - name: OpenBao transit
        role: state encryption key
        licence: MPL-2.0
    notes: 'Garage cannot hold state: it has no S3 versioning.'
    clauses:
      - clause: CAP-STATE.1
        status: planned
      - clause: CAP-STATE.2
        status: planned
      - clause: CAP-STATE.3
        status: planned
      - clause: CAP-STATE.4
        status: planned
      - clause: CAP-STATE.5
        status: planned
      - clause: CAP-STATE.6
        status: planned
      - clause: CAP-STATE.7
        status: planned
      - clause: CAP-STATE.8
        status: planned
  - capability: CAP-CIIDENTITY
    components:
      - name: CI OIDC token
        role: per-run identity from the CI host
      - name: OpenBao JWT auth
        role: exchanges the CI token for short-lived credentials
        licence: MPL-2.0
        deploy: Helm
        source: https://openbao.org/
      - name: Kubernetes projected service-account tokens
        role: in-cluster workload identity
        licence: Apache-2.0
        alternatives:
          - SPIFFE/SPIRE across clusters
    clauses:
      - clause: CAP-CIIDENTITY.1
        status: planned
      - clause: CAP-CIIDENTITY.2
        status: planned
      - clause: CAP-CIIDENTITY.3
        status: planned
      - clause: CAP-CIIDENTITY.4
        status: planned
      - clause: CAP-CIIDENTITY.5
        status: planned
      - clause: CAP-CIIDENTITY.6
        status: planned
  - capability: CAP-DELIVERY
    components:
      - name: Forgejo Actions
        role: plan and apply pipeline
        licence: GPL-3.0-or-later
      - name: Argo CD
        role: GitOps delivery of cluster workloads
        licence: Apache-2.0
        deploy: Helm
        source: https://argo-cd.readthedocs.io/
        alternatives:
          - Flux
    clauses:
      - clause: CAP-DELIVERY.1
        status: planned
      - clause: CAP-DELIVERY.2
        status: planned
      - clause: CAP-DELIVERY.3
        status: planned
      - clause: CAP-DELIVERY.4
        status: planned
      - clause: CAP-DELIVERY.5
        status: planned
      - clause: CAP-DELIVERY.6
        status: planned
      - clause: CAP-DELIVERY.7
        status: planned
      - clause: CAP-DELIVERY.8
        status: planned
  - capability: CAP-MODULES
    components:
      - name: OpenTofu modules in a tagged repository
        role: naming and building blocks
        licence: MPL-2.0
    clauses:
      - clause: CAP-MODULES.1
        status: planned
      - clause: CAP-MODULES.2
        status: planned
      - clause: CAP-MODULES.3
        status: planned
  - capability: CAP-ONBOARDING
    components:
      - name: Tenant YAML + OpenTofu
        role: generates identities, grants and schemas
        licence: MPL-2.0
    clauses:
      - clause: CAP-ONBOARDING.1
        status: planned
      - clause: CAP-ONBOARDING.2
        status: planned
      - clause: CAP-ONBOARDING.3
        status: planned
      - clause: CAP-ONBOARDING.4
        status: planned
  - capability: CAP-SECRETS
    components:
      - name: OpenBao
        role: secrets and transit keys
        licence: MPL-2.0
        deploy: Helm
        source: https://openbao.org/
        alternatives:
          - SOPS for files in Git
      - name: External Secrets Operator
        role: syncs secrets into workloads by reference
        licence: Apache-2.0
        deploy: Helm
    clauses:
      - clause: CAP-SECRETS.1
        status: planned
      - clause: CAP-SECRETS.2
        status: planned
      - clause: CAP-SECRETS.3
        status: planned
  - capability: CAP-NETWORK
    components:
      - name: Cilium
        role: default-deny policies, egress gateway, flow logs
        licence: Apache-2.0
        deploy: Helm
        source: https://cilium.io/
      - name: Gateway API + oauth2-proxy
        role: the only public entry, behind Keycloak sign-in
        licence: Apache-2.0
    notes: There is no provider-attested private endpoint; evidence is the policy code and flow logs.
    clauses:
      - clause: CAP-NETWORK.1
        status: planned
        how: Data services run as cluster services with no ingress; NetworkPolicy tests in CI prove unreachability.
      - clause: CAP-NETWORK.2
        status: planned
      - clause: CAP-NETWORK.3
        status: planned
      - clause: CAP-NETWORK.4
        status: planned
  - capability: CAP-GUARDRAILS
    components:
      - name: OPA Gatekeeper
        role: admission policy; same language as the Trino policies
        licence: Apache-2.0
        deploy: Helm
        alternatives:
          - Kyverno
      - name: Conftest
        role: policy on OpenTofu plans
        licence: Apache-2.0
      - name: Airflow
        role: scheduled fitness functions
        licence: Apache-2.0
    clauses:
      - clause: CAP-GUARDRAILS.1
        status: planned
      - clause: CAP-GUARDRAILS.2
        status: planned
      - clause: CAP-GUARDRAILS.3
        status: planned
  - capability: CAP-STORAGE
    components:
      - name: Ceph RGW via Rook
        role: S3-compatible object storage
        licence: LGPL-2.1-or-later
        deploy: Rook operator
        source: https://rook.io/
        alternatives:
          - SeaweedFS for kind/k3d
          - Garage for kind/k3d (no versioning)
    notes: MinIO community edition is archived and not maintained; do not use it.
    clauses:
      - clause: CAP-STORAGE.1
        status: planned
      - clause: CAP-STORAGE.2
        status: planned
      - clause: CAP-STORAGE.3
        status: planned
      - clause: CAP-STORAGE.4
        status: planned
      - clause: CAP-STORAGE.5
        status: planned
  - capability: CAP-TABLES
    components:
      - name: Apache Iceberg
        role: open table format
        licence: Apache-2.0
        source: https://iceberg.apache.org/
    notes: Iceberg table maintenance (compaction, snapshot expiry, orphan removal) is a scheduled job here, not a managed service.
    clauses:
      - clause: CAP-TABLES.1
        status: planned
      - clause: CAP-TABLES.2
        status: planned
      - clause: CAP-TABLES.3
        status: planned
      - clause: CAP-TABLES.4
        status: planned
  - capability: CAP-CATALOG
    components:
      - name: Lakekeeper
        role: Iceberg REST catalog, grants (OpenFGA), credential vending
        licence: Apache-2.0
        deploy: Helm
        source: https://github.com/lakekeeper/lakekeeper
        alternatives:
          - Apache Polaris
      - name: Trino + OPA
        role: the only engine that serves row-filtered and masked data
        licence: Apache-2.0
    notes: No open-source catalog evaluates row filters itself; enforcement is in Trino through OPA.
    clauses:
      - clause: CAP-CATALOG.1
        status: planned
      - clause: CAP-CATALOG.2
        status: planned
      - clause: CAP-CATALOG.3
        status: planned
      - clause: CAP-CATALOG.4
        status: planned
      - clause: CAP-CATALOG.5
        status: planned
        how: Protected tables are readable only through Trino with OPA row-filter and mask policies; Spark and DuckDB identities are denied them.
      - clause: CAP-CATALOG.6
        status: planned
      - clause: CAP-CATALOG.7
        status: planned
  - capability: CAP-COMPUTE
    components:
      - name: Apache Spark 4 via Kubeflow spark-operator
        role: batch and streaming jobs
        licence: Apache-2.0
        deploy: Helm
      - name: Trino
        role: interactive SQL
        licence: Apache-2.0
        deploy: Helm
        source: https://trino.io/
      - name: DuckDB
        role: small in-process jobs
        licence: MIT
    clauses:
      - clause: CAP-COMPUTE.1
        status: deviation
        consequence: The Trino coordinator runs continuously; workers scale down. Idle cost is one coordinator plus the cluster's base nodes.
      - clause: CAP-COMPUTE.2
        status: planned
      - clause: CAP-COMPUTE.3
        status: planned
      - clause: CAP-COMPUTE.4
        status: planned
  - capability: CAP-OPERATIONALDB
    components:
      - name: CloudNativePG
        role: Postgres operator
        licence: Apache-2.0
        deploy: Helm
        source: https://cloudnative-pg.io/
      - name: CSI volume snapshots on Ceph RBD
        role: copy-on-write clones that bootstrap branch clusters
        licence: LGPL-2.1-or-later
      - name: pgroll
        role: expand/contract migrations
        licence: Apache-2.0
        alternatives:
          - Xata OSS for instant branches
    notes: 'A branch is a separate Postgres instance started from a copy-on-write volume snapshot: minutes, not seconds, and point-in-time branches need WAL replay.'
    clauses:
      - clause: CAP-OPERATIONALDB.1
        status: planned
      - clause: CAP-OPERATIONALDB.2
        status: planned
        how: CI snapshots the production volume and starts a CloudNativePG cluster from it; a TTL controller deletes it.
      - clause: CAP-OPERATIONALDB.3
        status: planned
      - clause: CAP-OPERATIONALDB.4
        status: planned
      - clause: CAP-OPERATIONALDB.5
        status: planned
      - clause: CAP-OPERATIONALDB.6
        status: planned
      - clause: CAP-OPERATIONALDB.7
        status: planned
  - capability: CAP-INGESTION
    components:
      - name: Debezium on Kafka via Strimzi
        role: change data capture
        licence: Apache-2.0
        deploy: Strimzi operator
      - name: Trino connectors
        role: federation in place
        licence: Apache-2.0
      - name: Landing bucket + pipeline
        role: file landing, archive and quarantine
    clauses:
      - clause: CAP-INGESTION.1
        status: planned
      - clause: CAP-INGESTION.2
        status: planned
      - clause: CAP-INGESTION.3
        status: planned
      - clause: CAP-INGESTION.4
        status: planned
  - capability: CAP-INTEROPERABILITY
    components:
      - name: Envoy Gateway
        role: API gateway for versioned interfaces
        licence: Apache-2.0
        deploy: Helm
      - name: Schema validation at the landing edge
        role: partner-feed contracts
    clauses:
      - clause: CAP-INTEROPERABILITY.1
        status: planned
      - clause: CAP-INTEROPERABILITY.2
        status: planned
      - clause: CAP-INTEROPERABILITY.3
        status: planned
      - clause: CAP-INTEROPERABILITY.4
        status: planned
      - clause: CAP-INTEROPERABILITY.5
        status: planned
      - clause: CAP-INTEROPERABILITY.6
        status: planned
      - clause: CAP-INTEROPERABILITY.7
        status: planned
      - clause: CAP-INTEROPERABILITY.8
        status: planned
      - clause: CAP-INTEROPERABILITY.9
        status: planned
  - capability: CAP-ORCHESTRATION
    components:
      - name: Apache Airflow 3
        role: jobs, triggers, range backfills
        licence: Apache-2.0
        deploy: Helm
        source: https://airflow.apache.org/
        alternatives:
          - Dagster
    clauses:
      - clause: CAP-ORCHESTRATION.1
        status: planned
      - clause: CAP-ORCHESTRATION.2
        status: planned
      - clause: CAP-ORCHESTRATION.3
        status: planned
      - clause: CAP-ORCHESTRATION.4
        status: planned
      - clause: CAP-ORCHESTRATION.5
        status: planned
      - clause: CAP-ORCHESTRATION.6
        status: planned
  - capability: CAP-TRANSFORMATION
    components:
      - name: dbt (v1, Python)
        role: versioned models and tests
        licence: Apache-2.0
        source: https://github.com/dbt-labs/dbt
        alternatives:
          - SQLMesh
      - name: dbt-trino adapter
        role: runs models on Trino
        licence: Apache-2.0
    clauses:
      - clause: CAP-TRANSFORMATION.1
        status: planned
      - clause: CAP-TRANSFORMATION.2
        status: planned
      - clause: CAP-TRANSFORMATION.3
        status: planned
      - clause: CAP-TRANSFORMATION.4
        status: planned
      - clause: CAP-TRANSFORMATION.5
        status: planned
      - clause: CAP-TRANSFORMATION.6
        status: planned
      - clause: CAP-TRANSFORMATION.7
        status: planned
      - clause: CAP-TRANSFORMATION.8
        status: planned
  - capability: CAP-SEMANTICS
    components:
      - name: dbt semantic layer (dbt 1.12 or later, latest YAML spec)
        role: measure and indicator definitions beside the models
        licence: Apache-2.0
        source: https://docs.getdbt.com/docs/build/latest-metrics-spec
      - name: MetricFlow
        role: validates and compiles definitions to Trino SQL
        licence: Apache-2.0
        source: https://github.com/dbt-labs/metricflow
      - name: Generated saved-query models
        role: dbt models generated from MetricFlow's compiled SQL; read by Superset and publication
    notes: 'Cube Core is not an alternative here: its dbt integration does not import MetricFlow metrics, so measures would be defined twice.'
    clauses:
      - clause: CAP-SEMANTICS.1
        status: planned
      - clause: CAP-SEMANTICS.2
        status: deviation
        consequence: Superset 6 cannot read MetricFlow directly, so dashboards read saved-query tables generated from the definitions. Definitions stay single-sourced, but ad-hoc metric slicing in Superset is limited to those tables until Superset 7's semantic-layer support and an open MetricFlow provider are mature.
      - clause: CAP-SEMANTICS.3
        status: planned
      - clause: CAP-SEMANTICS.4
        status: planned
      - clause: CAP-SEMANTICS.5
        status: planned
      - clause: CAP-SEMANTICS.6
        status: planned
      - clause: CAP-SEMANTICS.7
        status: planned
      - clause: CAP-SEMANTICS.8
        status: planned
      - clause: CAP-SEMANTICS.9
        status: planned
      - clause: CAP-SEMANTICS.10
        status: planned
  - capability: CAP-REPORTING
    components:
      - name: Apache Superset
        role: dashboards as code
        licence: Apache-2.0
        deploy: Helm
        source: https://superset.apache.org/
    notes: Natural-language query has no settled open-source default yet.
    clauses:
      - clause: CAP-REPORTING.1
        status: planned
      - clause: CAP-REPORTING.2
        status: planned
      - clause: CAP-REPORTING.3
        status: planned
  - capability: CAP-APPS
    components:
      - name: Kubernetes Deployment + Gateway API
        role: app hosting behind sign-in
        licence: Apache-2.0
        alternatives:
          - Knative Serving for scale to zero
    clauses:
      - clause: CAP-APPS.1
        status: planned
      - clause: CAP-APPS.2
        status: planned
