        status: planned
      - clause: CAP-APPS.4
        status: planned
      - clause: CAP-APPS.5
        status: planned
      - clause: CAP-APPS.6
        status: planned
      - clause: CAP-APPS.7
        status: planned
      - clause: CAP-APPS.8
        status: planned
      - clause: CAP-APPS.9
        status: planned
  - capability: CAP-QUALITY
    components:
      - name: dbt tests and contracts
        role: checks per tier
        licence: Apache-2.0
      - name: Great Expectations (GX Core)
        role: checks outside dbt
        licence: Apache-2.0
    notes: Soda Core moved to ELv2 in January 2026; it is not an open-source option.
    clauses:
      - clause: CAP-QUALITY.1
        status: planned
      - clause: CAP-QUALITY.2
        status: planned
      - clause: CAP-QUALITY.3
        status: planned
      - clause: CAP-QUALITY.4
        status: planned
      - clause: CAP-QUALITY.5
        status: planned
      - clause: CAP-QUALITY.6
        status: planned
  - capability: CAP-LINEAGE
    components:
      - name: OpenLineage
        role: lineage events from Airflow, Spark, dbt and Trino
        licence: Apache-2.0
        source: https://openlineage.io/
        alternatives:
          - Marquez
          - OpenMetadata
          - DataHub
    notes: Lineage exists only where an integration emits it; a job without one is a defect.
    clauses:
      - clause: CAP-LINEAGE.1
        status: planned
      - clause: CAP-LINEAGE.2
        status: planned
      - clause: CAP-LINEAGE.3
        status: planned
  - capability: CAP-OBSERVABILITY
    components:
      - name: OpenTelemetry Collector
        role: metrics, logs and traces pipeline
        licence: Apache-2.0
        deploy: Helm
      - name: Prometheus
        role: metrics
        licence: Apache-2.0
      - name: Grafana + Loki
        role: dashboards and logs
        licence: AGPL-3.0-only
        alternatives:
          - OpenSearch
    clauses:
      - clause: CAP-OBSERVABILITY.1
        status: planned
      - clause: CAP-OBSERVABILITY.2
        status: planned
      - clause: CAP-OBSERVABILITY.3
        status: planned
  - capability: CAP-MASTERDATA
    components:
      - name: Registry services on PostgreSQL (CloudNativePG)
        role: authoritative registries for institutions, people and posts
        licence: Apache-2.0
      - name: Splink
        role: deterministic, explainable record linkage for duplicate detection
        licence: MIT
        source: https://github.com/moj-analytical-services/splink
    clauses:
      - clause: CAP-MASTERDATA.1
        status: planned
      - clause: CAP-MASTERDATA.2
        status: planned
      - clause: CAP-MASTERDATA.3
        status: planned
      - clause: CAP-MASTERDATA.4
        status: planned
      - clause: CAP-MASTERDATA.5
        status: planned
      - clause: CAP-MASTERDATA.6
        status: planned
      - clause: CAP-MASTERDATA.7
        status: planned
      - clause: CAP-MASTERDATA.8
        status: planned
      - clause: CAP-MASTERDATA.9
        status: planned
  - capability: CAP-IDENTITY
    components:
      - name: Keycloak
        role: identity provider or broker to the organisation's directory
        licence: Apache-2.0
        deploy: Keycloak Operator
        source: https://www.keycloak.org/
    clauses:
      - clause: CAP-IDENTITY.1
        status: planned
        how: Group membership reaches services through OIDC claims at sign-in; short token lifetimes and session revocation stand in for push provisioning.
      - clause: CAP-IDENTITY.2
        status: planned
      - clause: CAP-IDENTITY.3
        status: planned
      - clause: CAP-IDENTITY.4
        status: planned
      - clause: CAP-IDENTITY.5
        status: planned
      - clause: CAP-IDENTITY.6
        status: planned
  - capability: CAP-REFERENCE
    components:
      - name: OpenMetadata
        role: data dictionary, glossary and code-list documentation
        licence: Apache-2.0
        deploy: Helm
        source: https://open-metadata.org/
      - name: Versioned code-list tables (dbt seeds)
        role: governed code lists and crosswalks
        licence: Apache-2.0
    clauses:
      - clause: CAP-REFERENCE.1
        status: planned
      - clause: CAP-REFERENCE.2
        status: planned
      - clause: CAP-REFERENCE.3
        status: planned
      - clause: CAP-REFERENCE.4
        status: planned
      - clause: CAP-REFERENCE.5
        status: planned
