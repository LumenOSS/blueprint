        role: open sharing protocol
        licence: Apache-2.0
        source: https://github.com/delta-io/delta-sharing
        alternatives:
          - Iceberg REST catalog with vended credentials
    notes: Neither path applies row filters or masks at share time; publication tables are de-identified copies.
    clauses:
      - clause: CAP-SHARING.1
        status: planned
      - clause: CAP-SHARING.2
        status: planned
      - clause: CAP-SHARING.3
        status: planned
      - clause: CAP-SHARING.4
        status: planned
      - clause: CAP-SHARING.5
        status: planned
      - clause: CAP-SHARING.6
