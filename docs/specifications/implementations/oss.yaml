        status: planned
      - clause: CAP-REFERENCE.7
        status: planned
      - clause: CAP-REFERENCE.8
        status: planned
      - clause: CAP-REFERENCE.9
        status: planned
  - capability: CAP-ACCESS
    components:
      - name: Entitlement table in Iceberg
        role: row scope, loaded from the authoritative feed
      - name: OPA policies for Trino
        role: row filters and masks
        licence: Apache-2.0
    notes: Who can see a given row is answered across the catalog, OPA and Superset; keep all three as code in one repository.
    clauses:
