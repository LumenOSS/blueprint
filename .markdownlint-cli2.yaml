# Markdown style: Google's Markdown guide, enforced where a linter can.
config:
  default: true
  # Long lines are allowed: tables and URLs cannot wrap.
  MD013: false
  # Inline HTML is used for <br/> inside Mermaid labels and tables.
  MD033: false
  # The same heading text (e.g. "Why") recurs under different parents.
  MD024:
    siblings_only: true
ignores:
  - "build/**"
  - "LICENSE"
